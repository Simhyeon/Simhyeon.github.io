// ── REPEAT LABEL HELPER ─────────────────────────────────────────────
function repeatLabel(val) {
  if (!val) return '';
  if (val === 'Daily') return '매일';
  if (val === 'Weekly') return '매주';
  if (val === 'Monthly') return '매월';
  if (val && val.startsWith('DayOfMonth:')) {
    const days = val.slice(11).split(',').map(d => d + '일');
    return days.join('·');
  }
  if (val && val.startsWith('DayOfWeek:')) {
    const names = ['일', '월', '화', '수', '목', '금', '토'];
    const days = val.slice(10).split(',').map(d => names[parseInt(d)] || d);
    return days.join('·') + '요일';
  }
  return val;
}

function repeatClass(val) {
  if (!val) return '';
  if (val === 'Daily') return 'repeat-daily';
  if (val === 'Weekly') return 'repeat-weekly';
  if (val === 'Monthly') return 'repeat-monthly';
  if (val && val.startsWith('DayOfMonth:')) return 'repeat-monthly';
  if (val && val.startsWith('DayOfWeek:')) return 'repeat-weekly';
  return 'repeat-daily';
}

// ── REPORT REPOSITORY ───────────────────────────────────────────────────
const ReportRepository = (() => {
  const KEY = 'app_reports_v1';
  const MAX = 7;
  const DOW_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
  // ISO 8601: 월=1 ~ 일=7 (JS getDay()는 일=0 ~ 토=6)
  const toISODow = (jsDow) => jsDow === 0 ? 7 : jsDow;
  const dowName = (jsDow) => DOW_NAMES[jsDow];

  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const write = (d) => localStorage.setItem(KEY, JSON.stringify(d));

  // 오늘 보고서 생성 또는 업데이트 (기존 기록과 merge)
  const upsert = (dateKey, dow, done, missed) => {
    const reports = read();
    const idx = reports.findIndex(r => r.date === dateKey);
    const doneTitles = done.map(i => i.title || i);
    const missedTitles = missed.map(i => i.title || i);
    if (idx !== -1) {
      const r = reports[idx];
      // 기존 기록과 merge — 중복 제거, 기존 항목 유지
      const mergedDone = [...new Set([...r.done, ...doneTitles])];
      // missed에서 done으로 이동한 항목 제거
      const mergedMissed = [...new Set([...r.missed, ...missedTitles])]
        .filter(t => !mergedDone.includes(t));
      // done에서 missed로 이동한 항목 제거
      const finalDone = mergedDone.filter(t => !mergedMissed.includes(t));
      reports[idx] = { ...r, done: finalDone, missed: mergedMissed,
        dow: r.dow || toISODow(dow), dowName: r.dowName || dowName(dow),
        updatedAt: new Date().toISOString() };
    } else {
      const entry = {
        date: dateKey, dow: toISODow(dow), dowName: dowName(dow),
        done: [...new Set(doneTitles)],
        missed: [...new Set(missedTitles)].filter(t => !doneTitles.includes(t)),
        updatedAt: new Date().toISOString(),
      };
      reports.unshift(entry);
      if (reports.length > MAX) reports.pop();
    }
    write(reports);
    return reports.find(r => r.date === dateKey);
  };

  // 개별 마감: 특정 아이템 하나를 보고서에 추가/갱신
  const upsertItem = (dateKey, dow, item, done) => {
    const reports = read();
    const idx = reports.findIndex(r => r.date === dateKey);
    if (idx !== -1) {
      const r = reports[idx];
      // 기존 목록에서 제거 후 재추가
      r.done = r.done.filter(t => t !== item.title);
      r.missed = r.missed.filter(t => t !== item.title);
      if (done) r.done.push(item.title);
      else r.missed.push(item.title);
      r.updatedAt = new Date().toISOString();
      write(reports);
    } else {
      // 해당 날 보고서 없으면 새로 생성
      const entry = {
        date: dateKey,
        dow: toISODow(dow), dowName: dowName(dow),
        done: done ? [item.title] : [],
        missed: done ? [] : [item.title],
        updatedAt: new Date().toISOString(),
      };
      reports.unshift(entry);
      if (reports.length > MAX) reports.pop();
      write(reports);
    }
  };

  const getAll = () => read();

  // 보고서 텍스트 생성
  const toText = (report) => {
    const lines = [];
    const dowLabel = report.dowName || report.dow;
    lines.push('📅 ' + report.date + ' (' + dowLabel + '요일)');
    lines.push('');
    lines.push('✅ 완료한 일');
    if (report.done.length > 0) {
      report.done.forEach(function(t) { lines.push('  • ' + t); });
    } else { lines.push('  (없음)'); }
    lines.push('');
    lines.push('❌ 완료하지 못한 일');
    if (report.missed.length > 0) {
      report.missed.forEach(function(t) { lines.push('  • ' + t); });
    } else { lines.push('  (없음)'); }
    return lines.join('\n');
  };

  return { upsert, upsertItem, getAll, toText };
})();

// ── APP SESSION (개시시간 + 자동마감) ────────────────────────────────────
const AppSession = (() => {
  const KEY_LAST_VISIT  = 'app_last_visit';
  const KEY_LAST_CLOSED = 'app_last_closed';
  const KEY_OPEN_TIME   = 'app_open_time';

  const getOpenTime  = () => localStorage.getItem(KEY_OPEN_TIME) || '06:00';
  const setOpenTime  = (t) => localStorage.setItem(KEY_OPEN_TIME, t);
  const getLastVisit = () => { const v = localStorage.getItem(KEY_LAST_VISIT);  return v ? new Date(v) : null; };
  const setLastVisit = (d) => localStorage.setItem(KEY_LAST_VISIT, d.toISOString());
  const getLastClosed  = () => { const v = localStorage.getItem(KEY_LAST_CLOSED); return v ? new Date(v) : null; };
  const setLastClosed  = (d) => localStorage.setItem(KEY_LAST_CLOSED, d.toISOString());

  const openTimeOf = (date, timeStr) => {
    const [h, m] = timeStr.split(':').map(Number);
    return new Date(date.getFullYear(), date.getMonth(), date.getDate(), h, m, 0);
  };

  const dateKey = (d) =>
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const daysBetween = (a, b) => {
    const days = [];
    const cur = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    const end = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    while (cur < end) { days.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
    return days;
  };

  const onAppStart = () => {
    const now = MockClock.now();
    const openTimeStr = getOpenTime();
    const lastVisit   = getLastVisit();
    const lastClosed  = getLastClosed();

    const todayOpenTime = openTimeOf(now, openTimeStr);
    const effectiveToday = now >= todayOpenTime
      ? new Date(now.getFullYear(), now.getMonth(), now.getDate())
      : new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);

    const effectiveTodayKey = dateKey(effectiveToday);
    const lastClosedKey = lastClosed ? dateKey(lastClosed) : null;

    // lastVisit도 effective 기준으로 날짜 계산
    let lastVisitKey = null;
    if (lastVisit) {
      const lvOpen = openTimeOf(lastVisit, openTimeStr);
      const lvEffective = lastVisit >= lvOpen
        ? new Date(lastVisit.getFullYear(), lastVisit.getMonth(), lastVisit.getDate())
        : new Date(lastVisit.getFullYear(), lastVisit.getMonth(), lastVisit.getDate() - 1);
      lastVisitKey = dateKey(lvEffective);
    }

    if (lastVisit && lastVisitKey !== effectiveTodayKey) {
      // 날짜가 바뀐 경우 — 마지막 방문일에 마감 안 됐으면 그 날 마감
      if (lastClosedKey !== lastVisitKey) {
        const lastVisitDay = new Date(lastVisit.getFullYear(), lastVisit.getMonth(), lastVisit.getDate());
        performClose(lastVisitDay);
      }

      // 미접속 기간 체크
      const missedStart = new Date(lastVisit.getFullYear(), lastVisit.getMonth(), lastVisit.getDate() + 1);
      const missedDays  = daysBetween(missedStart, effectiveToday);

      if (missedDays.length > 0) {
        showStatModal(
          '자동 마감',
          missedDays.length + '일간 접속하지 않았어요.\n미접속 기간(' + dateKey(missedDays[0]) + ' ~ ' + dateKey(missedDays[missedDays.length-1]) + ') 동안 자동 마감을 할까요?',
          '자동 마감',
          () => {
            missedDays.forEach(day => performClose(day, true));
            checkDayTransitions();
            renderAll();
            showToast(missedDays.length + '일치 자동 마감 완료');
          },
          'background:var(--accent);border:none;color:#fff;font-weight:600;'
        );
      } else {
        // 어제→오늘 전환: 날짜 관련 상태 업데이트
        checkDayTransitions();
        // 개시 시간이 지나 새 하루가 시작될 때 토스트
        setTimeout(() => showToast('🌅 새로운 하루를 시작합니다'), 300);
      }
    } else {
      // 같은 날 재접속 — 상태 변경 없음 (checkDayTransitions 호출 안 함)
      // 단, 첫 접속(lastVisit 없음)이면 초기 상태 설정
      if (!lastVisit) checkDayTransitions();
    }

    setLastVisit(now);
  };

  return { onAppStart, getOpenTime, setOpenTime, getLastVisit, getLastClosed, setLastClosed, dateKey };
})();

// ── STATS RENDER ──────────────────────────────────────────────────
const HEATMAP_MAX = { Daily: 28, Weekly: 16, Monthly: 12 };
// DayOfWeek/DayOfMonth는 주간 기준으로 히스토리 표시
function getMaxPeriods(repeat) {
  if (!repeat) return 12;
  if (repeat === 'Daily') return 28;
  if (repeat === 'Weekly') return 16;
  if (repeat === 'Monthly') return 12;
  // DayOfWeek/DayOfMonth: 해당 날만 필터되므로 충분히 많이 순회
  if (repeat && (repeat.startsWith('DayOfWeek:') || repeat.startsWith('DayOfMonth:'))) return 90;
  return 12;
}

function renderStats() {
  // 통계탭은 paused 포함 모든 반복 todo 표시
  const items = TodoRepository.getAll().filter(i => i.meta.repeat);
  const list = document.getElementById('stats-list');
  const empty = document.getElementById('stats-empty');
  list.innerHTML = '';

  if (items.length === 0) { empty.classList.add('show'); return; }
  empty.classList.remove('show');

  items.forEach(item => {
    const colorHex = getColorVar(item.meta.color);
    const repeat = item.meta.repeat;
    const maxPeriods = getMaxPeriods(repeat);
    const createdAt = new Date(item.createdAt);

    // getHistory가 반환하는 모든 기간 중 생성일 이후만 필터 (로컬 기준)
    const allHistory = StatsRepository.getHistory(item.id, repeat, maxPeriods);
    const createdLocal = new Date(createdAt.getFullYear(), createdAt.getMonth(), createdAt.getDate());
    const history = allHistory.filter(h => {
      // h.date는 해당 기간을 대표하는 날짜 — 생성일과 직접 비교
      const hDate = new Date(h.date.getFullYear(), h.date.getMonth(), h.date.getDate());
      return hDate >= createdLocal;
    });

    if (history.length === 0) return;

    const currentKey = StatsRepository.getPeriodKey(repeat);

    // 기록이 실제로 저장된 기간만 통계에 반영
    // (현재 기간이더라도 이미 마감 기록이 있으면 포함)
    const allRecorded = StatsRepository.getAllForItem(item.id);
    const recordedHistory = history.filter(h =>
      h.key !== currentKey || h.key in allRecorded
    );
    const doneCount = recordedHistory.filter(h => h.done).length;
    const total = recordedHistory.length;
    const rate = total > 0 ? Math.round((doneCount / total) * 100) : 0;

    // streak: 최근부터 연속 완료 수 (현재 기간 제외)
    let streak = 0;
    for (let i = recordedHistory.length - 1; i >= 0; i--) {
      if (recordedHistory[i].done) streak++; else break;
    }

    const card = document.createElement('div');
    card.className = 'stat-card';
    if (colorHex) card.style.setProperty('--card-color', colorHex);

    // repeat 배지 색상
    const rptClass = repeatClass(repeat);

    // Heatmap cells
    const cellsHtml = history.map(h => {
      const isCurrent = h.key === currentKey;
      let cls = 'heatmap-cell';
      if (isCurrent) cls += ' current';
      else if (h.done) cls += ' done';
      else if (!isCurrent && h.key in allRecorded) cls += ' missed';
      // currentKey가 allRecorded에 있으면 (마감됨) done/missed 반영
      if (isCurrent && h.key in allRecorded) {
        cls = 'heatmap-cell' + (h.done ? ' done' : ' missed');
      }
      let label = '';
      if (repeat === 'Daily') label = String(h.date.getDate()).padStart(2,'0');
      else if (repeat === 'Weekly') label = 'W' + h.key.split('W')[1];
      else label = (h.date.getMonth() + 1) + '월';
      return `<div class="${cls}" title="${label}"></div>`;
    }).join('');

    const labelsHtml = history.map((h, i) => {
      let label = '';
      if (repeat === 'Daily') label = i % 7 === 0 ? String(h.date.getDate()) : '';
      else if (repeat === 'Weekly') label = h.key.split('W')[1];
      else label = String(h.date.getMonth() + 1);
      return `<div class="heatmap-label">${label}</div>`;
    }).join('');

    const isPaused = !!item.meta.paused;
    const pausedBadge = isPaused ? ' <span class="meta-tag" style="font-size:9px;padding:1px 5px;background:var(--surface3);color:var(--text-3)">중단</span>' : '';

    // 이번 기간에 마감 기록이 있으면 '마감' 배지
    const closedPeriodKey = StatsRepository.getPeriodKey(repeat);
    const closedThisPeriod = closedPeriodKey && (closedPeriodKey in allRecorded);
    const closedDone = closedThisPeriod && allRecorded[closedPeriodKey];
    const closedBadge = closedThisPeriod
      ? ` <span class="meta-tag" style="font-size:9px;padding:1px 5px;${closedDone ? 'background:var(--accent-dim);color:var(--accent)' : 'background:var(--red-dim);color:var(--red)'}">마감</span>`
      : '';

    card.innerHTML = `
      <div class="stat-card-header">
        <div class="stat-card-title">${escHtml(item.title)}${pausedBadge}${closedBadge}</div>
        <div class="stat-card-badges">
          <span class="meta-tag ${rptClass}" style="font-size:10px;padding:2px 6px">${repeatLabel(repeat)}</span>
          <span class="stat-rate">${total > 0 ? rate + '%' : '—'}</span>
        </div>
      </div>
      <div class="stat-heatmap">${cellsHtml}</div>
      <div class="heatmap-label-row">${labelsHtml}</div>
      <div class="stat-summary">
        <div class="stat-summary-item">
          <div class="stat-summary-val">${doneCount}</div>
          <div class="stat-summary-lbl">완료</div>
        </div>
        <div class="stat-summary-item">
          <div class="stat-summary-val">${total - doneCount}</div>
          <div class="stat-summary-lbl">미완료</div>
        </div>
        <div class="stat-summary-item">
          <div class="stat-summary-val">${streak}</div>
          <div class="stat-summary-lbl">연속</div>
        </div>
        <div class="stat-summary-item">
          <div class="stat-summary-val">${total > 0 ? rate + '%' : '—'}</div>
          <div class="stat-summary-lbl">달성률</div>
        </div>
      </div>
      <div class="stat-actions">
        <button class="action-btn stat-pause-btn">${isPaused ? '재개' : '중단'}</button>
        <button class="action-btn stat-reset-btn">새로 시작</button>
        <button class="action-btn danger stat-delete-btn">삭제</button>
      </div>
    `;

    card.querySelector('.stat-reset-btn').addEventListener('click', () => {
      showStatModal(
        '새로 시작하기',
        '"' + item.title + '"의 기존 통계를 모두 지우고 오늘부터 새로 시작할까요?',
        '새로 시작',
        () => {
          const statsData = JSON.parse(localStorage.getItem('todo_stats_v1') || '{}');
          delete statsData[item.id];
          localStorage.setItem('todo_stats_v1', JSON.stringify(statsData));
          const fresh = TodoRepository.getAll().find(i => i.id === item.id);
          if (fresh) {
            TodoRepository.update(item.id, { createdAt: new Date().toISOString() });
          }
          renderStats();
        },
        'background:var(--accent);border:none;color:#fff;font-weight:600;'
      );
    });

    card.querySelector('.stat-pause-btn').addEventListener('click', () => {
      const fresh = TodoRepository.getAll().find(i => i.id === item.id);
      if (!fresh) return;
      TodoRepository.update(item.id, { meta: { ...fresh.meta, paused: !fresh.meta.paused } });
      renderStats();
      renderAll();
    });

    card.querySelector('.stat-delete-btn').addEventListener('click', () => {
      showStatModal(
        item.title + ' 삭제',
        '이 반복 TODO와 통계 기록을 모두 삭제할까요? 되돌릴 수 없어요.',
        '삭제',
        () => {
          const statsData = JSON.parse(localStorage.getItem('todo_stats_v1') || '{}');
          delete statsData[item.id];
          localStorage.setItem('todo_stats_v1', JSON.stringify(statsData));
          TodoRepository.remove(item.id);
          // 통계 오버레이 닫기 (fab/close-btn이 가려지는 문제 방지)
          document.getElementById('stats-overlay').classList.remove('open');
          renderStats();
          renderAll();
        },
        'background:var(--red);border:none;color:#fff;font-weight:600;'
      );
    });

    list.appendChild(card);
  });
}

    });
    list.appendChild(card);
  });
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    if (!overlay.classList.contains('open')) return;
    const vv = window.visualViewport;
    const kbHeight = window.innerHeight - vv.height - vv.offsetTop;
    if (kbHeight > 50) {
      overlay.style.height = vv.height + 'px';
      overlay.style.top = vv.offsetTop + 'px';
    } else {
      overlay.style.height = '';
      overlay.style.top = '';
    }
  });
}

// ── PC 좌우 빈 공간 스크롤 위임 ────────────────────────────────────────
document.body.addEventListener('wheel', (e) => {
  const todoScroll = document.getElementById('todo-scroll');
  if (!todoScroll) return;
  // 이벤트가 이미 todo-scroll 내부에서 발생했으면 스킵
  if (todoScroll.contains(e.target)) return;
  // 오버레이가 열려있으면 스킵
  if (document.getElementById('modal-overlay')?.classList.contains('open')) return;
  if (document.getElementById('archive-overlay')?.classList.contains('open')) return;
  if (document.getElementById('stats-overlay')?.classList.contains('open')) return;
  e.preventDefault();
  todoScroll.scrollTop += e.deltaY;
}, { passive: false });

// ── 날짜 변경 감지 및 inactive 전환 ─────────────────────────────────────
// 반복형 TODO 추적기 초기화 (체크박스→false, 카운터→0)
function resetTrackers(item) {
  if (!item.trackers || item.trackers.length === 0) return;
  const resetted = item.trackers.map(t => {
    if (t.type === 'counter') return { ...t, current: 0 };
    return { ...t, checked: false }; // checkbox
  });
  TodoRepository.update(item.id, { trackers: resetted });
}

function checkDayTransitions(rerender = false) {
  const effective = getEffectiveNow();
  const todayDate = effective.getDate();
  const todayDow  = effective.getDay();
  let changed = false;

  TodoRepository.getAll().forEach(item => {
    const r = item.meta.repeat;

    let shouldBeActive = false;
    let resetCompleted = false; // Completed 상태도 Active로 리셋할지

    if (r === 'Daily') {
      shouldBeActive = true;
      resetCompleted = true; // 매일: 다음날 개시 시 완료 → 진행 중
    } else if (r === 'Weekly') {
      shouldBeActive = (todayDow === 1);
      resetCompleted = true; // 매주: 월요일 개시 시 완료 → 진행 중
    } else if (r === 'Monthly') {
      shouldBeActive = (todayDate === 1);
      resetCompleted = true; // 매달: 1일 개시 시 완료 → 진행 중
    } else if (r && r.startsWith('DayOfWeek:')) {
      shouldBeActive = r.slice(10).split(',').map(Number).includes(todayDow);
      resetCompleted = false; // 개시시간 전 완료는 유지
    } else if (r && r.startsWith('DayOfMonth:')) {
      shouldBeActive = r.slice(11).split(',').map(Number).includes(todayDate);
      resetCompleted = false;
    } else {
      return;
    }

    if (shouldBeActive) {
      if (item.meta.status === 'Inactive') {
        const restoreStatus = item.meta.prevStatus || 'Active';
        TodoRepository.update(item.id, { meta: { ...item.meta, status: restoreStatus, inactive: false, prevStatus: null } });
        resetTrackers(item);
        changed = true;
      } else if (item.meta.status === 'Overdue') {
        TodoRepository.update(item.id, { meta: { ...item.meta, status: 'Active', inactive: false, prevStatus: null } });
        resetTrackers(item);
        changed = true;
      } else if (item.meta.status === 'Completed' && resetCompleted) {
        // 매일/매주/매달: 새 주기 시작 시 완료 → 진행 중
        TodoRepository.update(item.id, { meta: { ...item.meta, status: 'Active', inactive: false, prevStatus: null } });
        resetTrackers(item);
        changed = true;
      }
    } else {
      // 오늘 해당 아님 — Active/Overdue/Completed 모두 Inactive로
      if (item.meta.status === 'Active' || item.meta.status === 'Overdue' ||
          (item.meta.status === 'Completed' && !resetCompleted)) {
        TodoRepository.update(item.id, { meta: { ...item.meta, status: 'Inactive', inactive: true, prevStatus: item.meta.status } });
        changed = true;
      }
    }
  });
  if (rerender && changed) renderAll();
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TODO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Bricolage+Grotesque:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── DESIGN TOKENS (expense-dashboard 스타일 시스템) ── */
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f1efe8;
    --surface3: #e8e6df;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.20);
    --text: #2c2c2a;
    --text-2: #5f5e5a;
    --text-3: #888780;
    --accent: #534ab7;
    --accent-dim: #eeedfe;
    --accent-border: rgba(83,74,183,0.35);
    --red: #a32d2d;
    --red-dim: #fcebeb;
    --amber: #854f0b;
    --amber-dim: #faeeda;
    --blue: #1a5276;
    --blue-dim: #d6eaf8;
    --teal: #0f6e56;
    --teal-dim: #e1f5ee;
    --purple: #6c3483;
    --purple-dim: #f5eef8;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 5px;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Mono', 'Consolas', monospace;
    --transition: 0.15s ease;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #2c2c2a;
      --surface2: #232321;
      --surface3: #2e2e2b;
      --border: rgba(255,255,255,0.10);
      --border2: rgba(255,255,255,0.20);
      --text: #f1efe8;
      --text-2: #b4b2a9;
      --text-3: #888780;
      --accent: #afa9ec;
      --accent-dim: #26215c;
      --accent-border: rgba(175,169,236,0.35);
      --red: #f7c1c1;
      --red-dim: #501313;
      --amber: #fac775;
      --amber-dim: #412402;
      --blue: #9ec8f0;
      --blue-dim: #0d2137;
      --teal: #9fe1cb;
      --teal-dim: #04342c;
      --purple: #d2a8e8;
      --purple-dim: #2e1542;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
  }

  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── HEADER ── */
  #header {
    padding: 18px 20px 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
  }

  #header-left h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
    line-height: 1;
  }

  #header-left .date-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.03em;
    margin-top: 4px;
  }

  .stats-pills {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .stat-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    color: var(--text-3);
    background: var(--surface2);
    letter-spacing: 0.02em;
  }
  .stat-pill.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .stat-pill.overdue { border-color: rgba(163,45,45,0.3); color: var(--red); background: var(--red-dim); }

  /* ── SUB BAR ── */
  #sub-bar {
    padding: 8px 20px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
  }

  .sub-bar-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.04em;
    transition: all var(--transition);
    display: flex; align-items: center; gap: 5px;
  }
  .sub-bar-btn:hover { border-color: var(--border2); color: var(--text-2); }
  .sub-bar-btn.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .sub-bar-btn.active svg { transform: rotate(180deg); }

  /* ── TODO LIST ── */
  #todo-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px 120px;
    scrollbar-width: none;
    background: var(--bg);
  }
  #todo-scroll::-webkit-scrollbar { display: none; }

  #todo-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ── TODO CARD ── */
  .todo-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    position: relative;
    overflow: hidden;
    cursor: default;
  }
  .card-main { user-select: none; }
  .card-drag-handle { cursor: grab; }
  .card-drag-handle:active { cursor: grabbing; }
  .card-expanded { user-select: text; cursor: default; }
  .card-expanded * { -webkit-user-select: text; user-select: text; }
  .inline-edit-content { -webkit-user-modify: read-write; }

  .todo-card:hover { border-color: var(--border2); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .todo-card.dragging {
    opacity: 0.5;
    transform: scale(0.98);
    border-color: var(--accent-border);
  }
  .todo-card.drag-over { border-color: var(--accent-border); background: var(--accent-dim); }
  .todo-card.pinned { cursor: default; }
  .todo-card.expanded { border-color: var(--border2); background: var(--surface); }

  .todo-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-color, transparent);
    border-radius: 3px 0 0 3px;
  }

  .card-main {
    padding: 11px 12px 11px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-drag-handle {
    flex-shrink: 0;
    width: 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    opacity: 0.2;
    transition: opacity var(--transition);
    padding: 2px 0;
    user-select: none;
  }
  .todo-card:hover .card-drag-handle { opacity: 0.4; }
  .todo-card.pinned .card-drag-handle { opacity: 0.1; }
  .card-drag-handle span {
    display: block;
    height: 1.5px;
    background: var(--text);
    border-radius: 2px;
  }

  .card-checkbox {
    width: 17px; height: 17px;
    border: 1.5px solid var(--border2);
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    transition: all var(--transition);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .card-checkbox:hover { border-color: var(--accent); }
  .card-checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .card-checkbox.checked::after {
    content: '';
    width: 6px; height: 4px;
    border-left: 1.5px solid #fff;
    border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
  }

  .card-title-wrap { flex: 1; min-width: 0; }
  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color var(--transition);
  }
  .card-title.done { text-decoration: line-through; color: var(--text-3); }

  .card-meta-row {
    display: flex;
    gap: 5px;
    margin-top: 3px;
    flex-wrap: wrap;
  }

  .meta-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 20px;
    letter-spacing: 0.02em;
    font-weight: 500;
  }
  .meta-tag.status-active { background: var(--accent-dim); color: var(--accent); }
  .meta-tag.status-completed { background: var(--surface2); color: var(--text-3); }
  .meta-tag.status-archived { background: var(--surface2); color: var(--text-3); }
  .meta-tag.status-overdue { background: var(--red-dim); color: var(--red); }
  .meta-tag.status-notyet { background: var(--blue-dim); color: var(--blue); }
  .meta-tag.repeat { background: var(--teal-dim); color: var(--teal); }
  .meta-tag.repeat-daily { background: var(--blue-dim); color: var(--blue); }
  .meta-tag.repeat-weekly { background: var(--teal-dim); color: var(--teal); }
  .meta-tag.repeat-monthly { background: var(--purple-dim); color: var(--purple); }
  .meta-tag.deadline { background: var(--amber-dim); color: var(--amber); }
  .meta-tag.template { background: var(--purple-dim); color: var(--purple); }

  .card-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .pin-btn {
    width: 24px; height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    padding: 0;
    opacity: 0;
    transition: opacity var(--transition), color var(--transition);
  }
  .todo-card:hover .pin-btn { opacity: 1; }
  .pin-btn.pinned { color: var(--amber); opacity: 1; }
  .pin-btn svg { width: 13px; height: 13px; }

  .expand-btn {
    width: 24px; height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    display: flex; align-items: center; justify-content: center;
    transition: color var(--transition);
    border-radius: 4px;
  }
  .expand-btn:hover { color: var(--text-2); }
  .expand-btn svg {
    width: 12px; height: 12px;
    transition: transform var(--transition);
  }
  .todo-card.expanded .expand-btn svg { transform: rotate(180deg); }

  /* ── EXPANDED PANEL ── */
  .card-expanded {
    display: none;
    padding: 0 16px 14px 16px;
    border-top: 0.5px solid var(--border);
  }
  .card-expanded.open { display: block; }

  /* ── EXPANDED INLINE EDIT ── */
  .expanded-view-mode { padding: 10px 0 8px; }
  .expanded-title-display {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .expanded-detail-display {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .expanded-detail-display.empty { color: var(--text-3); font-style: italic; }

  .expanded-edit-mode { padding: 10px 0 8px; }
  .inline-edit-field { margin-bottom: 8px; }
  .inline-edit-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .inline-edit-content {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    padding: 6px 10px;
    border-radius: var(--radius-xs);
    border: 0.5px solid var(--accent-border);
    background: var(--surface2);
    outline: none;
    min-height: 34px;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
    cursor: text;
    touch-action: manipulation;
  }
  .inline-edit-content.multiline {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-2);
    min-height: 60px;
    white-space: pre-wrap;
  }
  .inline-edit-content:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .meta-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .meta-field label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .meta-field input, .meta-field select {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-xs);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    padding: 6px 8px;
    outline: none;
    transition: border-color var(--transition);
    width: 100%;
  }
  .meta-field input:focus, .meta-field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }
  .meta-field input[type="date"]:focus { border-color: var(--accent-border); }
  .meta-field select option { background: var(--surface); }
  .meta-field.full-width { grid-column: 1 / -1; }

  .color-picker-row { display: flex; gap: 6px; margin-top: 4px; }
  .color-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color var(--transition), transform var(--transition);
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: var(--text); }

  .template-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle-switch {
    width: 32px; height: 18px;
    background: var(--surface3);
    border: 0.5px solid var(--border2);
    border-radius: 9px;
    position: relative;
    transition: background var(--transition);
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--accent-dim); border-color: var(--accent-border); }
  .toggle-switch::after {
    content: '';
    width: 12px; height: 12px;
    background: var(--text-3);
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
    transition: transform var(--transition), background var(--transition);
  }
  .toggle-switch.on::after { transform: translateX(14px); background: var(--accent); }
  .template-toggle span { font-size: 12px; color: var(--text-2); }

  .expanded-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 0.5px solid var(--border);
  }
  .action-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: var(--radius-xs);
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all var(--transition);
  }
  .action-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .action-btn.danger:hover { border-color: rgba(163,45,45,0.4); color: var(--red); background: var(--red-dim); }
  .action-btn.archive:hover { border-color: rgba(133,79,11,0.4); color: var(--amber); background: var(--amber-dim); }
  .action-btn.archive.disabled { opacity: 0.3; cursor: not-allowed; }
  .action-btn.archive.disabled:hover { border-color: var(--border2); color: var(--text-2); background: transparent; }
  .action-btn.danger.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .action-btn.danger.disabled:hover { border-color: var(--border2); color: var(--text-2); background: transparent; }
  .action-btn.save { margin-left: auto; }
  .action-btn.repeat-close { border-color: var(--blue-dim); color: var(--blue); }
  .action-btn.repeat-close:hover { border-color: var(--blue); background: var(--blue-dim); color: var(--blue); }

  /* SECTION LABEL */
  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  /* ── EMPTY STATE ── */
  #empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 60px 20px;
    color: var(--text-3);
    text-align: center;
  }
  #empty-state.show { display: flex; }
  #empty-state .empty-icon { font-size: 32px; color: var(--surface3); }
  #empty-state p { font-size: 13px; color: var(--text-3); }

  /* ── FAB & CLOSE BTN ── */
  #fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(calc(-100% - 6px));
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(83,74,183,0.30);
    transition: transform var(--transition), box-shadow var(--transition);
    z-index: 100;
  }
  #fab:hover { transform: translateX(calc(-100% - 6px)) scale(1.06); box-shadow: 0 4px 20px rgba(83,74,183,0.40); }
  #fab:active { transform: translateX(calc(-100% - 6px)) scale(0.96); }
  #fab svg { width: 22px; height: 22px; color: #fff; }

  #close-btn {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(6px);
    width: 52px; height: 52px;
    background: var(--surface);
    border-radius: 50%;
    border: 0.5px solid var(--border2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform var(--transition), background var(--transition);
    z-index: 100;
    color: var(--text-2);
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  #close-btn:hover { transform: translateX(6px) scale(1.06); background: var(--surface2); color: var(--accent); }
  #close-btn:active { transform: translateX(6px) scale(0.96); }
  #close-btn svg { width: 20px; height: 20px; }

  /* ── MODAL OVERLAY ── */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  /* ── ADD SHEET ── */
  #add-sheet {
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    border-top: 0.5px solid var(--border2);
    border-left: 0.5px solid var(--border);
    border-right: 0.5px solid var(--border);
    width: 100%;
    max-width: 480px;
    padding: 0 0 env(safe-area-inset-bottom, 16px);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 90vh;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #add-sheet::-webkit-scrollbar { display: none; }
  #modal-overlay.open #add-sheet { transform: translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 12px auto 4px;
  }

  .sheet-header {
    padding: 8px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
  }
  .sheet-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .sheet-close {
    width: 28px; height: 28px;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .sheet-close:hover { background: var(--surface3); color: var(--text); }
  .sheet-close svg { width: 12px; height: 12px; }

  .sheet-body { padding: 16px 20px; }

  .sheet-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-body);
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    padding: 0;
    caret-color: var(--accent);
    display: block;
  }
  .sheet-input::placeholder { color: var(--text-3); }

  .sheet-detail-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-2);
    padding: 0;
    caret-color: var(--accent);
    resize: none;
    min-height: 40px;
    margin-top: 8px;
    line-height: 1.6;
  }
  .sheet-detail-input::placeholder { color: var(--text-3); }

  .sheet-divider { height: 0.5px; background: var(--border); margin: 12px 0; }

  .meta-expand-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    cursor: pointer;

<script>
// ── MOCK CLOCK (테스트용) ─────────────────────────────────────────
const MockClock = (() => {
  let _mockDate = null;
  const now = () => _mockDate ? new Date(_mockDate) : new Date();
  const set = (d) => { _mockDate = d ? new Date(d) : null; };
  const isActive = () => _mockDate !== null;
  return { now, set, isActive };
})();

// ── STATS REPOSITORY ──────────────────────────────────────────────
// 반복 todo 완료 기록: { [itemId]: { [periodKey]: bool } }
// periodKey: 'daily:2025-01-15' | 'weekly:2025-W03' | 'monthly:2025-01'
const StatsRepository = (() => {
  const KEY = 'todo_stats_v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const write = (d) => localStorage.setItem(KEY, JSON.stringify(d));

  // 로컬 날짜를 'YYYY-MM-DD' 문자열로 변환 (UTC 아닌 로컬 기준)
  const localDateStr = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  };

  // 로컬 기준 ISO 주차 계산
  const localISOWeek = (d) => {
    const tmp = new Date(d.getFullYear(), d.getMonth(), d.getDate()); // 로컬 자정
    const dayOfWeek = tmp.getDay() || 7; // 1=Mon ... 7=Sun
    tmp.setDate(tmp.getDate() + 4 - dayOfWeek); // 해당 주의 목요일
    const jan1 = new Date(tmp.getFullYear(), 0, 1);
    const w = Math.ceil(((tmp - jan1) / 86400000 + 1) / 7);
    return `${tmp.getFullYear()}-W${String(w).padStart(2, '0')}`;
  };

  const getPeriodKey = (repeat, date) => {
    const d = date || MockClock.now();
    if (repeat === 'Daily') {
      return 'daily:' + localDateStr(d);
    } else if (repeat === 'Weekly') {
      return 'weekly:' + localISOWeek(d);
    } else if (repeat === 'Monthly') {
      return `monthly:${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }
    return null;
  };

  const mark = (itemId, repeat, done) => {
    const key = getPeriodKey(repeat);
    if (!key) return;
    const data = read();
    if (!data[itemId]) data[itemId] = {};
    data[itemId][key] = done;
    write(data);
  };

  const isCompletedThisPeriod = (itemId, repeat) => {
    const key = getPeriodKey(repeat);
    if (!key) return false;
    const data = read();
    return !!(data[itemId] && data[itemId][key]);
  };

  const getHistory = (itemId, repeat, periodsBack = 12) => {
    const data = read();
    const history = data[itemId] || {};
    const result = [];
    const now = MockClock.now();
    // 로컬 자정 기준 날짜 복사
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    for (let i = periodsBack - 1; i >= 0; i--) {
      let d;
      if (repeat === 'Daily') {
        d = new Date(base);
        d.setDate(base.getDate() - i);
      } else if (repeat === 'Weekly') {
        d = new Date(base);
        d.setDate(base.getDate() - i * 7);
      } else if (repeat === 'Monthly') {
        d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      }
      const key = getPeriodKey(repeat, d);
      result.push({ key, done: !!(history[key]), date: d });
    }
    return result;
  };

  const getAllForItem = (itemId) => {
    const data = read();
    return data[itemId] || {};
  };

  return { mark, isCompletedThisPeriod, getHistory, getPeriodKey, getAllForItem };
})();

// ── DATA LAYER (Repository Pattern) ──────────────────────────────
const TodoRepository = (() => {
  const STORAGE_KEY = 'todo_items_v1';
  const ORDER_KEY = 'todo_order_v1';

  // These can be swapped for any backend adapter
  const adapter = {
    read: () => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    },
    write: (items) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    },
    readOrder: () => {
      try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; }
      catch { return []; }
    },
    writeOrder: (order) => {
      localStorage.setItem(ORDER_KEY, JSON.stringify(order));
    }
  };

  const getAll = () => adapter.read();
  const getOrder = () => adapter.readOrder();

  const save = (items) => adapter.write(items);
  const saveOrder = (order) => adapter.writeOrder(order);

  const create = (data) => {
    const items = getAll();
    const newItem = {
      id: `todo_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      title: data.title || '',
      detail: data.detail || '',
      pinned: false,
      meta: {
        status: data.meta?.status || 'Active',
        repeat: data.meta?.repeat || null,
        deadline: data.meta?.deadline || null,
        startDate: data.meta?.startDate || null,
        memorable: data.meta?.memorable || false,
        paused: false,
        color: data.meta?.color || '',
      },
      trackers: data.trackers || [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    items.push(newItem);
    save(items);

    const order = getOrder();
    order.push(newItem.id);
    saveOrder(order);

    return newItem;
  };

  const update = (id, patch) => {
    const items = getAll();
    const idx = items.findIndex(i => i.id === id);
    if (idx === -1) return null;
    const updatedItem = { ...items[idx], ...patch, updatedAt: new Date().toISOString() };
    if (patch.meta) {
      // 기존 meta를 먼저 두고 patch.meta로 덮어쓰기 — repeat 등 미지정 필드는 보존
      updatedItem.meta = { ...items[idx].meta, ...patch.meta };
    }
    items[idx] = updatedItem;
    save(items);
    return items[idx];
  };

  const remove = (id) => {
    let items = getAll();
    items = items.filter(i => i.id !== id);
    save(items);
    const order = getOrder().filter(oid => oid !== id);
    saveOrder(order);
  };

  const reorder = (newOrder) => saveOrder(newOrder);

  const getSorted = () => {
    const items = getAll();
    const order = getOrder();
    const map = Object.fromEntries(items.map(i => [i.id, i]));
    const ordered = order.map(id => map[id]).filter(Boolean);
    items.forEach(item => { if (!order.includes(item.id)) ordered.push(item); });
    return ordered;
  };

  return { getAll, getSorted, getOrder, create, update, remove, reorder };
})();

// ── BUSINESS LOGIC ────────────────────────────────────────────────
const TodoService = {
  checkOverdue: (item) => {
    if (!item.meta.deadline) return false;
    if (['Completed', 'Archived'].includes(item.meta.status)) return false;
    return new Date(item.meta.deadline) < MockClock.now();
  },

  checkNotYet: (item) => {
    if (!item.meta.startDate) return false;
    if (['Completed', 'Archived'].includes(item.meta.status)) return false;
    const start = new Date(item.meta.startDate);
    start.setHours(0, 0, 0, 0);
    const today = MockClock.now();
    today.setHours(0, 0, 0, 0);
    return start > today;
  },

  resolveStatus: (item) => {
    if (!item?.meta?.status) return 'Active';
    if (TodoService.checkNotYet(item)) return 'NotYet';
    if (TodoService.checkOverdue(item)) return 'Overdue';
    return item.meta.status;
  },

  formatDate: (dateStr) => {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
  },

  toggle: (id) => {
    const items = TodoRepository.getAll();
    const item = items.find(i => i.id === id);
    if (!item) return;
    const newStatus = item.meta.status === 'Completed' ? 'Active' : 'Completed';
    // memorable은 절대 변경하지 않고 status만 업데이트
    return TodoRepository.update(id, { meta: { status: newStatus, memorable: item.meta.memorable } });
  }
};

// ── UI STATE ──────────────────────────────────────────────────────
let currentFilter = 'all';
let dragState = { dragging: null, placeholder: null };
let expandedId = null;
let selectedAddColor = '';
let addMemorableOn = false;
let addTrackers = [];
let showCompleted = localStorage.getItem('show_completed') !== 'false';

// ── RENDER ────────────────────────────────────────────────────────
function getColorVar(colorVal) {
  // Map CSS variable strings to hex for style
  const map = {
    'var(--accent)': '#c8f064',
    'var(--blue)': '#6db3f2',
    'var(--amber)': '#f4a535',
    'var(--red)': '#ff6b6b',
    'var(--purple)': '#a89fec',
    'var(--teal)': '#5dcaa5',
  };
  return map[colorVal] || colorVal || '';
}

function filterItems(items) {
  // 'all': Archived 항상 숨김, Completed·NotYet은 showCompleted 플래그에 따라 숨김
  return items.filter(i => {
    if (i.meta.paused) return false;
    const s = TodoService.resolveStatus(i);
    if (s === 'Archived') return false;
    if ((s === 'Completed' || s === 'NotYet') && !showCompleted) return false;
    return true;
  });
}

function renderAll() {
  const allItems = TodoRepository.getSorted();
  const filtered = filterItems(allItems);

  const list = document.getElementById('todo-list');
  const empty = document.getElementById('empty-state');

  list.innerHTML = '';

  if (filtered.length === 0) {
    empty.classList.add('show');
  } else {
    empty.classList.remove('show');
  }

  filtered.forEach(item => list.appendChild(createCard(item)));

  updateStats(allItems);
  setupDragDrop();

  // 카드 확장 중이면 하단 버튼 숨김
  const hasExpanded = expandedId !== null;
  document.getElementById('fab').style.display = hasExpanded ? 'none' : '';
  document.getElementById('close-btn').style.display = hasExpanded ? 'none' : '';
}

function createCard(item) {
  const status = TodoService.resolveStatus(item);
  const isDone = item.meta.status === 'Completed';
  const colorHex = getColorVar(item.meta.color);

  const card = document.createElement('div');
  card.className = `todo-card${item.pinned ? ' pinned' : ''}${expandedId === item.id ? ' expanded' : ''}`;
  card.dataset.id = item.id;
  if (colorHex) card.style.setProperty('--card-color', colorHex);

  // Build meta tags
  const statusLabel = { Active: 'Active', Completed: 'Completed', Overdue: 'Overdue', NotYet: 'Not yet', Archived: 'Archived' };
  let metaTagsHTML = '';
  metaTagsHTML += `<span class="meta-tag status-${status.toLowerCase()}">${statusLabel[status] || status}</span>`;
  if (item.meta.repeat) {
    const rClass = item.meta.repeat === 'Daily' ? 'repeat-daily' : item.meta.repeat === 'Weekly' ? 'repeat-weekly' : 'repeat-monthly';
    metaTagsHTML += `<span class="meta-tag ${rClass}">${item.meta.repeat}</span>`;
  }
  if (item.meta.memorable) metaTagsHTML += `<span class="meta-tag template">보관하기</span>`;
  if (item.meta.deadline) {
    const df = TodoService.formatDate(item.meta.deadline);
    metaTagsHTML += `<span class="meta-tag deadline">${df}</span>`;
  }

  card.innerHTML = `
    <div class="card-main">
      <div class="card-drag-handle" data-drag>
        <span></span><span></span><span></span>
      </div>
      <div class="card-checkbox${isDone ? ' checked' : ''}" data-toggle></div>
      <div class="card-title-wrap">
        <div class="card-title${isDone ? ' done' : ''}">${escHtml(item.title)}</div>
        <div class="card-meta-row">${metaTagsHTML}</div>
      </div>
      <div class="card-right">

        <button class="expand-btn" data-expand>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="card-expanded${expandedId === item.id ? ' open' : ''}">
      ${renderExpandedPanel(item)}
    </div>
  `;

  // Wire events
  // 체크박스 클릭 (싱글) — 더블클릭과 구분하기 위해 딜레이 적용
  let clickTimer = null;
  card.querySelector('[data-toggle]').addEventListener('click', (e) => {
    e.stopPropagation();
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      TodoService.toggle(item.id);
      renderAll();
    }, 220);
  });

  // 더블클릭으로 Active ↔ Completed 토글
  card.querySelector('.card-main').addEventListener('dblclick', (e) => {
    if (e.target.closest('[data-pin],[data-toggle],[data-expand]')) return;
    e.stopPropagation();
    clearTimeout(clickTimer); // 싱글클릭 타이머 취소
    TodoService.toggle(item.id);
    renderAll();
  });



  card.querySelector('[data-expand]').addEventListener('click', (e) => {
    e.stopPropagation();
    expandedId = expandedId === item.id ? null : item.id;
    renderAll();
  });

  // Wire expanded panel events
  if (expandedId === item.id) {
    wireExpandedPanel(card, item);
  }



  return card;
}

function wireExpandedPanel(card, item) {
  // Memorable switch
  const tSwitch = card.querySelector('[data-template-switch]');
  if (tSwitch) {
    let memorableVal = item.meta.memorable;
    tSwitch.addEventListener('click', () => {
      memorableVal = !memorableVal;
      tSwitch.classList.toggle('on', memorableVal);
      const archiveBtn = card.querySelector('[data-archive]');
      if (archiveBtn) {
        archiveBtn.disabled = !memorableVal;
        archiveBtn.classList.toggle('disabled', !memorableVal);
      }
      // 즉시 저장
      item.meta.memorable = memorableVal;
      TodoRepository.update(item.id, { meta: { ...item.meta, memorable: memorableVal } });
      // 카드 상단 meta-row의 Memorable 배지 즉시 업데이트
      const metaRow = card.querySelector('.card-meta-row');
      if (metaRow) {
        const existing = metaRow.querySelector('.meta-tag.template');
        if (memorableVal && !existing) {
          const badge = document.createElement('span');
          badge.className = 'meta-tag template';
          badge.textContent = '보관하기';
          metaRow.appendChild(badge);
        } else if (!memorableVal && existing) {
          existing.remove();
        }
      }
    });
    tSwitch._getVal = () => memorableVal;
  }

  // Color picker — 클릭 즉시 저장
  const colorDots = card.querySelectorAll('[data-color-picker] .color-dot');
  let selectedColor = item.meta.color;
  colorDots.forEach(dot => {
    dot.addEventListener('click', () => {
      colorDots.forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      selectedColor = dot.dataset.colorVal;
      // 즉시 저장
      item.meta.color = selectedColor;
      TodoRepository.update(item.id, { meta: { ...item.meta, color: selectedColor } });
      // 카드 색상 바 즉시 반영
      const hex = getColorVar(selectedColor);
      if (hex) card.style.setProperty('--card-color', hex);
      else card.style.removeProperty('--card-color');
    });
  });

  // 트래커 렌더
  renderTrackers(card, item);

  // date input — 변경 즉시 저장 + scrollIntoView
  card.querySelectorAll('input[type="date"]').forEach(el => {
    el.addEventListener('focus', () => {
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 320);
    });
    el.addEventListener('change', () => {
      const field = el.dataset.field;
      item.meta[field] = el.value || null;
      TodoRepository.update(item.id, { meta: { ...item.meta, [field]: el.value || null } });
    });
  });

  // Memorable switch — 즉시 저장 (기존 클릭 핸들러는 tSwitch에 있고, 여기서 추가)

  // 수정/저장 토글 버튼
  const saveBtn = card.querySelector('[data-save]');
  const viewMode = card.querySelector('.expanded-view-mode');
  const editMode = card.querySelector('.expanded-edit-mode');
  const titleField = card.querySelector('[data-field="title"]');
  const detailField = card.querySelector('[data-field="detail"]');

  // contenteditable 필드 포커스 시 키보드가 가리지 않도록 scrollIntoView
  [titleField, detailField].forEach(el => {
    if (!el) return;
    el.addEventListener('focus', () => {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 320); // 키보드 올라오는 시간 대기
    });
  });

  saveBtn?.addEventListener('click', () => {
    const isEditing = saveBtn.dataset.editing === 'true';

    if (!isEditing) {
      // 수정 모드 진입
      viewMode.style.display = 'none';
      editMode.style.display = 'block';
      saveBtn.textContent = '저장';
      saveBtn.dataset.editing = 'true';
      // 제목 필드에 포커스 + 커서 끝으로
      if (titleField) {
        titleField.focus();
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(titleField);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } else {
      // 저장 — 텍스트만 업데이트, collapse하지 않음
      const titleVal = (titleField?.innerText || '').trim();
      const detailVal = (detailField?.innerText || '').trimEnd();
      const memorable = tSwitch?._getVal() ?? item.meta.memorable;

      if (titleVal) {
        // item 객체를 in-place 업데이트하여 재렌더 없이 상태 유지
        item.title = titleVal;
        item.detail = detailVal;
        item.meta.memorable = memorable;
        TodoRepository.update(item.id, { title: titleVal, detail: detailVal, meta: { ...item.meta, memorable } });

        // 뷰모드 텍스트만 갱신, collapse 안 함
        const viewTitle = card.querySelector('.expanded-title-display');
        const viewDetail = card.querySelector('.expanded-detail-display');
        if (viewTitle) viewTitle.textContent = titleVal;
        if (viewDetail) {
          viewDetail.textContent = detailVal || '상세 내용 없음';
          viewDetail.classList.toggle('empty', !detailVal);
        }
        // 카드 헤더 제목도 갱신
        const cardTitle = card.querySelector('.card-title');
        if (cardTitle) cardTitle.textContent = titleVal;

        // 수정 모드 → 보기 모드 전환 (collapse 없이)
        viewMode.style.display = '';
        editMode.style.display = 'none';
        saveBtn.textContent = '수정';
        saveBtn.dataset.editing = 'false';
      }
    }
  });

  // 제목 필드: Enter 키로 저장 (줄바꿈 X)
  titleField?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
  });
  // 상세 필드: Enter는 줄바꿈 허용, Shift+Enter도 동일
  detailField?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      // 기본 동작(줄바꿈) 허용 — 별도 처리 없음
      e.stopPropagation();
    }
  });

  // Delete
  card.querySelector('[data-delete]')?.addEventListener('click', () => {
    TodoRepository.remove(item.id);
    expandedId = null;
    renderAll();
  });

  // Archive
  card.querySelector('[data-archive]')?.addEventListener('click', () => {
    TodoRepository.update(item.id, { meta: { status: 'Archived' } });
    expandedId = null;
    renderAll();
    renderArchive();
  });

  // 개별 마감 (반복형 전용)
  card.querySelector('[data-repeat-close]')?.addEventListener('click', () => {
    const fresh = TodoRepository.getAll().find(i => i.id === item.id);
    if (!fresh) return;
    const alreadyClosed = StatsRepository.isCompletedThisPeriod(item.id, item.meta.repeat);
    if (alreadyClosed) {
      // 마감 취소: 이번 기간 기록 삭제
      const statsData = JSON.parse(localStorage.getItem('todo_stats_v1') || '{}');
      if (statsData[item.id]) {
        const key = StatsRepository.getPeriodKey(item.meta.repeat);
        delete statsData[item.id][key];
        localStorage.setItem('todo_stats_v1', JSON.stringify(statsData));
      }
      showToast('이번 기간 마감 취소됨');
    } else {
      // 개별 마감: 현재 완료 여부로 기록
      const done = fresh.meta.status === 'Completed';
      StatsRepository.mark(item.id, item.meta.repeat, done);
      showToast(done ? '완료로 기록됨' : '미완료로 기록됨');
    }
    // 버튼 텍스트 즉시 업데이트
    const btn = card.querySelector('[data-repeat-close]');
    if (btn) {
      const nowClosed = StatsRepository.isCompletedThisPeriod(item.id, item.meta.repeat);
      btn.textContent = nowClosed ? '마감 취소' : '개별 마감';
    }
    renderStats();
  });
}

function updateStats(items) {
  const active = items.filter(i => i.meta.status === 'Active' && !TodoService.checkOverdue(i)).length;
  const overdue = items.filter(i => TodoService.checkOverdue(i)).length;

  document.getElementById('stat-active').textContent = `${active} active`;
  const overdueEl = document.getElementById('stat-overdue');
  if (overdue > 0) {
    overdueEl.style.display = '';
    overdueEl.textContent = `${overdue} overdue`;
  } else {
    overdueEl.style.display = 'none';
  }
}

// ── DRAG & DROP (pointer events — works on mobile & desktop) ────────
function setupDragDrop() {
  const list = document.getElementById('todo-list');
  const cards = [...list.querySelectorAll('.todo-card')];

  cards.forEach(card => {
    const handle = card.querySelector('.card-drag-handle');
    if (!handle) return;

    let startY = 0, startX = 0;
    let isDragging = false;
    let clone = null;
    let placeholder = null;

    // 드래그 영역: 핸들 자체 + card-main의 왼쪽 48px 영역
    const cardMain = card.querySelector('.card-main');
    const dragZone = cardMain || handle;

    dragZone.addEventListener('pointerdown', (e) => {
      // card-main에서는 왼쪽 48px 이내만 드래그 허용
      if (e.currentTarget === cardMain) {
        const rect = cardMain.getBoundingClientRect();
        if (e.clientX - rect.left > 48) return;
      }
      if (card.classList.contains('expanded')) return;
      e.preventDefault();
      e.stopPropagation();

      startY = e.clientY;
      startX = e.clientX;
      isDragging = false;

      const cardRect = card.getBoundingClientRect();

      const onMove = (ev) => {
        const dy = Math.abs(ev.clientY - startY);
        const dx = Math.abs(ev.clientX - startX);

        if (!isDragging && (dy > 6 || dx > 6)) {
          isDragging = true;

          // Create floating clone
          clone = card.cloneNode(true);
          clone.style.cssText = `
            position: fixed;
            left: ${cardRect.left}px;
            top: ${cardRect.top}px;
            width: ${cardRect.width}px;
            opacity: 0.85;
            pointer-events: none;
            z-index: 1000;
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: none;
          `;
          document.body.appendChild(clone);

          // Placeholder
          placeholder = document.createElement('div');
          placeholder.className = 'drag-placeholder';
          placeholder.style.height = cardRect.height + 'px';
          list.insertBefore(placeholder, card);
          card.style.display = 'none';
          dragState = { dragging: card, placeholder };
        }

        if (!isDragging) return;

        const moveY = ev.clientY - startY;
        clone.style.top = (cardRect.top + moveY) + 'px';

        // Find insertion point
        const siblings = [...list.children].filter(el =>
          el !== placeholder && el !== card && el.classList.contains('todo-card')
        );
        let insertBefore = null;
        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          if (ev.clientY < r.top + r.height / 2) { insertBefore = sib; break; }
        }
        if (insertBefore) list.insertBefore(placeholder, insertBefore);
        else list.appendChild(placeholder);
      };

      const onUp = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);

        if (isDragging && clone && placeholder) {
          clone.remove();
          card.style.display = '';
          list.insertBefore(card, placeholder);
          placeholder.remove();
          saveOrder();
        }
        dragState = { dragging: null, placeholder: null };
        isDragging = false;
        clone = null;
        placeholder = null;
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

function saveOrder() {
  const list = document.getElementById('todo-list');
  const cards = [...list.querySelectorAll('.todo-card')];
  const newOrder = cards.map(c => c.dataset.id).filter(Boolean);
  TodoRepository.reorder(newOrder);
}

// ── ARCHIVE RENDER ────────────────────────────────────────────────
function renderArchive() {
  const items = TodoRepository.getAll().filter(i => i.meta.status === 'Archived');
  const list = document.getElementById('archive-list');
  const empty = document.getElementById('archive-empty');
  const pill = document.getElementById('archive-count-pill');

  list.innerHTML = '';
  pill.textContent = `${items.length}개`;

  if (items.length === 0) {
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  items.slice().reverse().forEach(item => {
    const colorHex = getColorVar(item.meta.color);
    const card = document.createElement('div');
    card.className = 'archive-card';
    if (colorHex) card.style.setProperty('--card-color', colorHex);

    const updatedDate = new Date(item.updatedAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });

    // 날짜 텍스트 포맷
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }) : null;
    const startStr = fmtDate(item.meta.startDate);
    const deadlineStr = fmtDate(item.meta.deadline);
    const metaLines = [
      startStr ? `<span><strong>시작</strong>${startStr}</span>` : '',
      deadlineStr ? `<span><strong>데드라인</strong>${deadlineStr}</span>` : '',
    ].filter(Boolean).join('');

    card.innerHTML = `
      <div class="archive-card-main">
        <div class="archive-card-title">${escHtml(item.title)}</div>
        <div class="archive-card-date">${updatedDate}</div>
        <button class="archive-expand-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
      </div>
      <div class="archive-card-detail">
        <p class="archive-detail-text${item.detail ? '' : ' empty'}">${item.detail ? escHtml(item.detail) : '내용 없음'}</p>
        ${metaLines ? `<div class="archive-meta-line">${metaLines}</div>` : ''}
        <div class="archive-card-actions">
          <button class="archive-restore-btn">복원</button>
          <button class="archive-delete-btn">삭제</button>
        </div>
      </div>
    `;

    card.querySelector('.archive-expand-btn').addEventListener('click', () => {
      card.classList.toggle('expanded');
    });
    card.querySelector('.archive-restore-btn').addEventListener('click', () => {
      const fresh = TodoRepository.getAll().find(i => i.id === item.id);
      if (fresh) TodoRepository.update(item.id, { meta: { ...fresh.meta, status: 'Active' } });
      renderArchive();
      renderAll();
    });
    card.querySelector('.archive-delete-btn').addEventListener('click', () => {
      TodoRepository.remove(item.id);
      renderArchive();
      renderAll();
    });
    list.appendChild(card);
  });
}

// ── 마감 (CLOSE) BUTTON ───────────────────────────────────────────
document.getElementById('close-btn').addEventListener('click', () => {
  const allItems = TodoRepository.getAll();
  const completedItems = allItems.filter(i => i.meta.status === 'Completed');
  const repeatItems = allItems.filter(i => i.meta.repeat && i.meta.status !== 'Archived' && !i.meta.paused);
  if (completedItems.length === 0 && repeatItems.length === 0) {
    showToast('처리할 TODO가 없어요');
    return;
  }
  const memorableItems = completedItems.filter(i => i.meta.memorable);
  const archiveCount = memorableItems.length;

  const modal = document.getElementById('confirm-modal');
  const countEl = document.getElementById('confirm-count');
  const descEl = document.getElementById('confirm-desc');
  if (countEl) countEl.textContent = archiveCount;
  if (descEl) {
    const now2 = MockClock.now();
    const dow2 = now2.getDay();
    const isLastDay2 = new Date(now2.getFullYear(), now2.getMonth()+1, 0).getDate() === now2.getDate();
    const closableRepeat = repeatItems.filter(i =>
      (i.meta.repeat === 'Daily') ||
      (i.meta.repeat === 'Weekly' && dow2 === 0) ||
      (i.meta.repeat === 'Monthly' && isLastDay2)
    );
    const parts = [];
    if (closableRepeat.length > 0) parts.push(`반복 ${closableRepeat.length}개 기록`);
    if (archiveCount > 0) parts.push(`보관 ${archiveCount}개`);
    const nonMemo = completedItems.filter(i => !i.meta.repeat && !i.meta.memorable).length;
    if (nonMemo > 0) parts.push(`삭제 ${nonMemo}개`);
    descEl.innerHTML = parts.length > 0
      ? parts.join(' · ') + '<br><span style="font-size:11px;color:var(--text-3)">마감을 진행할까요?</span>'
      : '마감할 항목이 없어요';
  }
  modal.classList.add('open');

  document.getElementById('confirm-cancel').onclick = () => modal.classList.remove('open');
  document.getElementById('confirm-ok').onclick = () => {
    const now = MockClock.now();
    const dow = now.getDay(); // 0=Sun
    const isLastDayOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() === now.getDate();
    let archived = 0, deleted = 0, statRecorded = 0;

    // 반복 todo 전체를 마감 조건에 따라 처리 (완료 여부 무관)
    repeatItems.forEach(item => {
      const shouldClose =
        (item.meta.repeat === 'Daily') ||
        (item.meta.repeat === 'Weekly' && dow === 0) ||
        (item.meta.repeat === 'Monthly' && isLastDayOfMonth);

      if (shouldClose) {
        const done = item.meta.status === 'Completed';
        StatsRepository.mark(item.id, item.meta.repeat, done);
        // 현재 저장된 최신 데이터를 읽어서 status만 리셋 — 나머지 필드 보존
        const fresh = TodoRepository.getAll().find(i => i.id === item.id);
        if (fresh) {
          TodoRepository.update(item.id, { meta: { ...fresh.meta, status: 'Active' } });
        }
        statRecorded++;
      }
      // shouldClose가 아닌 경우 아무것도 안 함
    });

    // 일반 todo (반복 없는 것만) 처리
    completedItems.filter(i => !i.meta.repeat).forEach(item => {
      if (item.meta.memorable) {
        TodoRepository.update(item.id, { meta: { status: 'Archived' } });
        archived++;
      } else {
        TodoRepository.remove(item.id);
        deleted++;
      }
    });

    modal.classList.remove('open');
    showCompleted = true;
    localStorage.setItem('show_completed', 'true');
    document.getElementById('show-completed-top-btn').classList.remove('active');
    document.getElementById('show-completed-label').textContent = '전부 보기';
    renderAll();
    renderStats();
    const parts = [];
    if (statRecorded) parts.push(`반복 ${statRecorded}개 기록됨`);
    if (archived) parts.push(`${archived}개 보관`);
    if (deleted) parts.push(`${deleted}개 삭제`);
    showToast(parts.join(', ') || '마감 완료');
  };
});

  if (!toast) {

    toast.style.cssText = `
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 0.5px solid var(--border2);

function normalizeTitle(s) {
  return s.replace(/\s+/g, '').toLowerCase();
}

function addTodo() {
  const title = titleInput.value.trim();
  if (!title) return;
  const norm = normalizeTitle(title);
  const isDuplicate = TodoRepository.getAll().some(i => normalizeTitle(i.title) === norm);
  if (isDuplicate) {
    titleInput.style.outline = '1.5px solid var(--red)';
    titleInput.placeholder = '이미 있는 이름이에요';
    setTimeout(() => {
      titleInput.style.outline = '';
      titleInput.placeholder = '제목을 입력하세요';
    }, 2000);
    return;
  }
  TodoRepository.create({
    title,
    detail: detailInput.value.trim(),
    trackers: addTrackers.map(t => ({ ...t })),
    meta: {
      status: 'Active',
      repeat: document.getElementById('add-repeat').value || null,
      startDate: document.getElementById('add-start-date').value || null,
      deadline: document.getElementById('add-deadline').value || null,
      memorable: addMemorableOn,
      color: selectedAddColor,
    }
  });
  closeSheet();
  renderAll();
}

document.getElementById('add-tracker-btn').addEventListener('click', () => {

document.querySelectorAll('#add-tracker-picker .tracker-type-btn').forEach(btn => {

function renderAddTrackerItem(tracker) {
  const list = document.getElementById('add-tracker-list');
  const el = document.createElement('div');
  el.className = 'tracker-item';
  el.dataset.tid = tracker.id;
  if (tracker.type === 'checkbox') {
    el.innerHTML = `<div class="tracker-checkbox${tracker.checked ? ' checked' : ''}"></div><input class="tracker-text-input${tracker.checked ? ' checked' : ''}" placeholder="항목 이름" value="${escHtml(tracker.text)}"><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    const cb = el.querySelector('.tracker-checkbox');
    const inp = el.querySelector('.tracker-text-input');
    cb.addEventListener('click', () => { tracker.checked = !tracker.checked; cb.classList.toggle('checked', tracker.checked); inp.classList.toggle('checked', tracker.checked); });
    inp.addEventListener('input', () => { tracker.text = inp.value; });
  } else {
    el.innerHTML = `<input class="tracker-counter-label" placeholder="설명" value="${escHtml(tracker.label)}"><div class="tracker-counter-controls"><input class="tracker-counter-val-input" type="number" min="0" value="${tracker.current}" style="width:38px"><span class="tracker-counter-sep">/</span><input class="tracker-counter-goal" type="number" min="0" value="${tracker.goal}"><button class="tracker-counter-btn" data-dir="1">+</button></div><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    el.querySelector('.tracker-counter-label').addEventListener('input', e => { tracker.label = e.target.value; });
    el.querySelector('.tracker-counter-val-input').addEventListener('input', e => { tracker.current = parseInt(e.target.value) || 0; });
    el.querySelector('.tracker-counter-goal').addEventListener('input', e => { tracker.goal = parseInt(e.target.value) || 0; });
    el.querySelector('.tracker-counter-btn').addEventListener('click', () => {
      tracker.current++;
      el.querySelector('.tracker-counter-val-input').value = tracker.current;
    });
  }
  el.querySelector('.tracker-delete-btn').addEventListener('click', () => { addTrackers = addTrackers.filter(t => t.id !== tracker.id); el.remove(); });
  list.appendChild(el);
}

function renderTrackers(card, item) {
  const existing = card.querySelector('.tracker-section-expanded');
  if (existing) existing.remove();
  if (!item.trackers || item.trackers.length === 0) {
    // 트래커 없어도 추가 UI는 보여줌
    appendTrackerAddRow(card, item);
    return;
  }
  const section = document.createElement('div');
  section.className = 'tracker-section-expanded';
  section.style.cssText = 'margin-bottom:10px;';
  const header = document.createElement('div');
  header.className = 'tracker-section-header';
  header.innerHTML = '<span class="tracker-section-label">트래커</span>';
  section.appendChild(header);
  item.trackers.forEach(tracker => {
    const el = buildTrackerEl(tracker, item, card, section);
    section.appendChild(el);
  });
  appendTrackerAddRow(card, item, section);
  const metaGrid = card.querySelector('.meta-grid');
  if (metaGrid) metaGrid.before(section);
  else card.querySelector('.card-expanded').appendChild(section);
}

function buildTrackerEl(tracker, item, card, section) {
  const el = document.createElement('div');
  el.className = 'tracker-item';
  el.dataset.tid = tracker.id;
  if (tracker.type === 'checkbox') {
    el.innerHTML = `<div class="tracker-checkbox${tracker.checked ? ' checked' : ''}"></div><input class="tracker-text-input${tracker.checked ? ' checked' : ''}" placeholder="항목 이름" value="${escHtml(tracker.text)}" style="flex:1"><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    const inp = el.querySelector('.tracker-text-input');
    inp.addEventListener('input', e => { tracker.text = e.target.value; saveTrackers(item); });
    el.querySelector('.tracker-checkbox').addEventListener('click', () => {
      tracker.checked = !tracker.checked;
      el.querySelector('.tracker-checkbox').classList.toggle('checked', tracker.checked);
      inp.classList.toggle('checked', tracker.checked);
      saveTrackers(item);
    });
  } else {
    el.innerHTML = `<input class="tracker-counter-label" placeholder="설명" value="${escHtml(tracker.label)}" style="flex:1;min-width:0"><div class="tracker-counter-controls"><input class="tracker-counter-val-input" type="number" min="0" value="${tracker.current}" style="width:38px"><span class="tracker-counter-sep">/</span><input class="tracker-counter-goal" type="number" min="0" value="${tracker.goal}" style="width:38px"><button class="tracker-counter-btn" data-dir="1">+</button></div><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    el.querySelector('.tracker-counter-label').addEventListener('input', e => { tracker.label = e.target.value; saveTrackers(item); });
    el.querySelector('.tracker-counter-val-input').addEventListener('input', e => { tracker.current = parseInt(e.target.value) || 0; saveTrackers(item); });
    el.querySelector('.tracker-counter-goal').addEventListener('change', e => { tracker.goal = parseInt(e.target.value) || 0; saveTrackers(item); });
    el.querySelector('.tracker-counter-btn').addEventListener('click', () => {
      tracker.current++;
      el.querySelector('.tracker-counter-val-input').value = tracker.current;
      saveTrackers(item);
    });
  }
  el.querySelector('.tracker-delete-btn').addEventListener('click', () => {
    item.trackers = item.trackers.filter(t => t.id !== tracker.id);
    saveTrackers(item);
    el.remove();
    if (item.trackers.length === 0) renderTrackers(card, item);
  });
  return el;
}

function appendTrackerAddRow(card, item, section) {
  if (!section) {
    // section 없으면 새로 만들어서 추가
    const s = document.createElement('div');
    s.className = 'tracker-section-expanded';
    s.style.cssText = 'margin-bottom:10px;';
    const h = document.createElement('div');
    h.className = 'tracker-section-header';
    h.innerHTML = '<span class="tracker-section-label">트래커</span>';
    s.appendChild(h);
    appendTrackerAddRow(card, item, s);
    const metaGrid = card.querySelector('.meta-grid');
    if (metaGrid) metaGrid.before(s);
    return;
  }
  const addRow = document.createElement('div');
  addRow.style.cssText = 'margin-top:4px;';
  addRow.innerHTML = `<button class="tracker-add-btn exp-tracker-add-btn" style="width:100%;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:10px;height:10px"><path d="M12 5v14M5 12h14"/></svg> 트래커 추가</button><div class="exp-tracker-picker" style="display:none;margin-top:4px"><div class="tracker-type-picker"><button class="tracker-type-btn" data-type="checkbox">☑ 체크박스</button><button class="tracker-type-btn" data-type="counter">🔢 카운터</button></div></div>`;
  addRow.querySelector('.exp-tracker-add-btn').addEventListener('click', () => {
    const p = addRow.querySelector('.exp-tracker-picker');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  });
  addRow.querySelectorAll('.tracker-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = 'tr_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
      const t = btn.dataset.type === 'checkbox'
        ? { id, type: 'checkbox', text: '', checked: false }
        : { id, type: 'counter', label: '', current: 0, goal: 10 };
      if (!item.trackers) item.trackers = [];
      item.trackers.push(t);
      saveTrackers(item);
      addRow.querySelector('.exp-tracker-picker').style.display = 'none';
      renderTrackers(card, item);
    });
  });
  section.appendChild(addRow);
}

// ── STATS RENDER ──────────────────────────────────────────────────
const HEATMAP_MAX = { Daily: 28, Weekly: 16, Monthly: 12 };

function renderStats() {
  // 통계탭은 paused 포함 모든 반복 todo 표시
  const items = TodoRepository.getAll().filter(i => i.meta.repeat);
  const list = document.getElementById('stats-list');
  const empty = document.getElementById('stats-empty');
  list.innerHTML = '';

  if (items.length === 0) { empty.classList.add('show'); return; }
  empty.classList.remove('show');

  items.forEach(item => {
    const colorHex = getColorVar(item.meta.color);
    const repeat = item.meta.repeat;
    const maxPeriods = HEATMAP_MAX[repeat] || 12;
    const createdAt = new Date(item.createdAt);

    // getHistory가 반환하는 모든 기간 중 생성일 이후만 필터 (로컬 기준)
    const allHistory = StatsRepository.getHistory(item.id, repeat, maxPeriods);
    const createdLocal = new Date(createdAt.getFullYear(), createdAt.getMonth(), createdAt.getDate());
    const history = allHistory.filter(h => {
      const periodStart = new Date(h.date.getFullYear(), h.date.getMonth(), h.date.getDate());
      if (repeat === 'Weekly') periodStart.setDate(periodStart.getDate() - ((periodStart.getDay() + 6) % 7));
      else if (repeat === 'Monthly') periodStart.setDate(1);
      return periodStart >= createdLocal;
    });

    if (history.length === 0) return;

    const currentKey = StatsRepository.getPeriodKey(repeat);

    // 기록이 실제로 저장된 기간만 통계에 반영
    // (현재 기간이더라도 이미 마감 기록이 있으면 포함)
    const allRecorded = StatsRepository.getAllForItem(item.id);
    const recordedHistory = history.filter(h =>
      h.key !== currentKey || h.key in allRecorded
    );
    const doneCount = recordedHistory.filter(h => h.done).length;
    const total = recordedHistory.length;
    const rate = total > 0 ? Math.round((doneCount / total) * 100) : 0;

    // streak: 최근부터 연속 완료 수 (현재 기간 제외)
    let streak = 0;
    for (let i = recordedHistory.length - 1; i >= 0; i--) {
      if (recordedHistory[i].done) streak++; else break;
    }

    const card = document.createElement('div');
    card.className = 'stat-card';
    if (colorHex) card.style.setProperty('--card-color', colorHex);

    // repeat 배지 색상
    const repeatClass = repeat === 'Daily' ? 'repeat-daily' : repeat === 'Weekly' ? 'repeat-weekly' : 'repeat-monthly';

    // Heatmap cells
    const cellsHtml = history.map(h => {
      const isCurrent = h.key === currentKey;
      let cls = 'heatmap-cell';
      if (isCurrent) cls += ' current';
      else if (h.done) cls += ' done';
      else if (!isCurrent && h.key in allRecorded) cls += ' missed';
      // currentKey가 allRecorded에 있으면 (마감됨) done/missed 반영
      if (isCurrent && h.key in allRecorded) {
        cls = 'heatmap-cell' + (h.done ? ' done' : ' missed');
      }
      let label = '';
      if (repeat === 'Daily') label = String(h.date.getDate()).padStart(2,'0');
      else if (repeat === 'Weekly') label = 'W' + h.key.split('W')[1];
      else label = (h.date.getMonth() + 1) + '월';
      return `<div class="${cls}" title="${label}"></div>`;
    }).join('');

    const labelsHtml = history.map((h, i) => {
      let label = '';
      if (repeat === 'Daily') label = i % 7 === 0 ? String(h.date.getDate()) : '';
      else if (repeat === 'Weekly') label = h.key.split('W')[1];
      else label = String(h.date.getMonth() + 1);
      return `<div class="heatmap-label">${label}</div>`;
    }).join('');

    const isPaused = !!item.meta.paused;
    const pausedBadge = isPaused ? ' <span class="meta-tag" style="font-size:9px;padding:1px 5px;background:var(--surface3);color:var(--text-3)">중단</span>' : '';

    card.innerHTML = `
      <div class="stat-card-header">
        <div class="stat-card-title">${escHtml(item.title)}${pausedBadge}</div>
        <div class="stat-card-badges">
          <span class="meta-tag ${repeatClass}" style="font-size:10px;padding:2px 6px">${repeat}</span>
          <span class="stat-rate">${total > 0 ? rate + '%' : '—'}</span>
        </div>
      </div>
      <div class="stat-heatmap">${cellsHtml}</div>
      <div class="heatmap-label-row">${labelsHtml}</div>
      <div class="stat-summary">
        <div class="stat-summary-item">
          <div class="stat-summary-val">${doneCount}</div>
          <div class="stat-summary-lbl">완료</div>
        </div>
        <div class="stat-summary-item">
          <div class="stat-summary-val">${total - doneCount}</div>
          <div class="stat-summary-lbl">미완료</div>
        </div>
        <div class="stat-summary-item">
          <div class="stat-summary-val">${streak}</div>
          <div class="stat-summary-lbl">연속</div>
        </div>
        <div class="stat-summary-item">
          <div class="stat-summary-val">${total > 0 ? rate + '%' : '—'}</div>
          <div class="stat-summary-lbl">달성률</div>
        </div>
      </div>
      <div class="stat-actions">
        <button class="action-btn stat-pause-btn">${isPaused ? '재개' : '중단'}</button>
        <button class="action-btn stat-reset-btn">새로 시작</button>
        <button class="action-btn danger stat-delete-btn">삭제</button>
      </div>
    `;

    card.querySelector('.stat-reset-btn').addEventListener('click', () => {
      showStatModal(
        '새로 시작하기',
        '"' + item.title + '"의 기존 통계를 모두 지우고 오늘부터 새로 시작할까요?',
        '새로 시작',
        () => {
          const statsData = JSON.parse(localStorage.getItem('todo_stats_v1') || '{}');
          delete statsData[item.id];
          localStorage.setItem('todo_stats_v1', JSON.stringify(statsData));
          const fresh = TodoRepository.getAll().find(i => i.id === item.id);
          if (fresh) {
            TodoRepository.update(item.id, { createdAt: new Date().toISOString() });
          }
          renderStats();
        },
        'background:var(--accent);border:none;color:#fff;font-weight:600;'
      );
    });

    card.querySelector('.stat-pause-btn').addEventListener('click', () => {
      const fresh = TodoRepository.getAll().find(i => i.id === item.id);
      if (!fresh) return;
      TodoRepository.update(item.id, { meta: { ...fresh.meta, paused: !fresh.meta.paused } });
      renderStats();
      renderAll();
    });

    card.querySelector('.stat-delete-btn').addEventListener('click', () => {
      showStatModal(
        item.title + ' 삭제',
        '이 반복 TODO와 통계 기록을 모두 삭제할까요? 되돌릴 수 없어요.',
        '삭제',
        () => {
          const statsData = JSON.parse(localStorage.getItem('todo_stats_v1') || '{}');
          delete statsData[item.id];
          localStorage.setItem('todo_stats_v1', JSON.stringify(statsData));
          TodoRepository.remove(item.id);
          renderStats();
          renderAll();
        },
        'background:var(--red);border:none;color:#fff;font-weight:600;'
      );
    });

    list.appendChild(card);
  });
}

// ── STATS VIEW EVENTS ─────────────────────────────────────────────
document.getElementById('stats-view-btn').addEventListener('click', () => {
  renderStats();
  const el = document.getElementById('stats-overlay');
  el.style.display = 'flex';
  requestAnimationFrame(() => el.classList.add('open'));
});

document.getElementById('stats-back-btn').addEventListener('click', () => {
  const el = document.getElementById('stats-overlay');
  el.classList.remove('open');
  setTimeout(() => { el.style.display = 'none'; }, 280);
});

// ── MOCK CLOCK EVENTS ─────────────────────────────────────────────
document.getElementById('mock-set-btn').addEventListener('click', () => {
  const val = document.getElementById('mock-input').value;
  if (!val) return;
  MockClock.set(new Date(val));
  document.getElementById('mock-panel').classList.add('mocked');
  document.getElementById('mock-label').textContent = '🕐 MOCK ON';
  updateDateLabel();
  renderAll();
  showToast('Mock 시간 적용됨: ' + MockClock.now().toLocaleString('ko-KR'));
});

document.getElementById('mock-reset-btn').addEventListener('click', () => {
  MockClock.set(null);
  document.getElementById('mock-panel').classList.remove('mocked');
  document.getElementById('mock-label').textContent = '🕐 Mock';
  document.getElementById('mock-input').value = '';
  updateDateLabel();
  renderAll();
  showToast('Mock 시간 해제됨');
});

document.getElementById('mock-hide-btn').addEventListener('click', () => {
  document.getElementById('mock-panel').style.display = 'none';
  document.getElementById('mock-toggle-btn').classList.add('visible');
  localStorage.setItem('mock_panel_hidden', 'true');
});

document.getElementById('mock-toggle-btn').addEventListener('click', () => {
  document.getElementById('mock-panel').style.display = '';
  document.getElementById('mock-toggle-btn').classList.remove('visible');
  localStorage.setItem('mock_panel_hidden', 'false');
});

// ── INIT ──────────────────────────────────────────────────────────
// mock-input 초기값 + 숨김 상태 복원
(function() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('mock-input').value =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (localStorage.getItem('mock_panel_hidden') === 'true') {
    document.getElementById('mock-panel').style.display = 'none';
    document.getElementById('mock-toggle-btn').classList.add('visible');
  }
})();
updateDateLabel();
seedIfEmpty();
// showCompleted 초기 상태를 버튼에 반영
(function() {
  document.getElementById('show-completed-label').textContent = showCompleted ? '전부 보기' : '미완료만';
})();
renderAll();
</script>
</body>
</html>

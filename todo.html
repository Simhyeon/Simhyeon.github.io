<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마침표</title>

<style>
  /* ── DESIGN TOKENS (expense-dashboard 스타일 시스템) ── */
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f1efe8;
    --surface3: #e8e6df;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.20);
    --text: #2c2c2a;
    --text-2: #5f5e5a;
    --text-3: #888780;
    --accent: #534ab7;
    --accent-dim: #eeedfe;
    --accent-border: rgba(83,74,183,0.35);
    --red: #c0392b;
    --red-dim: #fbeaea;
    --amber: #b07d2e;
    --amber-dim: #fdf3e0;
    --blue: #2471a3;
    --blue-dim: #d6eaf8;
    --teal: #148f77;
    --teal-dim: #d5f5ed;
    --purple: #7d3c98;
    --purple-dim: #f4ecf7;
    /* 팔레트 */
    --palette-red: #c0534a;
    --palette-green: #4a9e6b;
    --palette-yellow: #c9973a;
    --palette-blue: #3a7cc9;
    --palette-magenta: #a0478a;
    --palette-cyan: #2e9aab;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 5px;
    --font-display: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    --transition: 0.15s ease;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #2c2c2a;
      --surface2: #232321;
      --surface3: #2e2e2b;
      --border: rgba(255,255,255,0.10);
      --border2: rgba(255,255,255,0.20);
      --text: #f1efe8;
      --text-2: #b4b2a9;
      --text-3: #888780;
      --accent: #afa9ec;
      --accent-dim: #26215c;
      --accent-border: rgba(175,169,236,0.35);
      --red: #f08070;
      --red-dim: #4a1a14;
      --amber: #f0c070;
      --amber-dim: #3a2200;
      --blue: #7ab8f0;
      --blue-dim: #0d2137;
      --teal: #5ecfb0;
      --teal-dim: #04342c;
      --purple: #c898e8;
      --purple-dim: #2e1542;
      /* 팔레트 */
      --palette-red: #e06860;
      --palette-green: #60c080;
      --palette-yellow: #e0b050;
      --palette-blue: #5090e0;
      --palette-magenta: #c060a8;
      --palette-cyan: #40b8c8;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
  }

  /* PC에서 #app 양 옆 빈 공간 클릭/스크롤을 todo-scroll로 위임 */
  body { cursor: default; }

  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── HEADER ── */
  #header {
    padding: 18px 20px 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
  }

  #header-left h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
    line-height: 1;
  }

  #header-left .date-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.03em;
    margin-top: 4px;
  }

  .stats-pills {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .stat-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    color: var(--text-3);
    background: var(--surface2);
    letter-spacing: 0.02em;
  }
  .stat-pill.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .stat-pill.overdue { border-color: rgba(163,45,45,0.3); color: var(--red); background: var(--red-dim); }

  /* ── SUB BAR ── */
  #sub-bar {
    padding: 8px 20px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
  }

  .sub-bar-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.04em;
    transition: all var(--transition);
    display: flex; align-items: center; gap: 5px;
  }
  .sub-bar-btn:hover { border-color: var(--border2); color: var(--text-2); }
  .sub-bar-btn.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .sub-bar-btn.active svg { transform: rotate(180deg); }
  .filter-check-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-2);
    padding: 5px 0; cursor: pointer; white-space: nowrap;
  }
  .filter-check-row input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
  .filter-check-row:hover { color: var(--text); }

  /* ── TODO LIST ── */
  #todo-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px 120px;
    scrollbar-width: none;
    background: var(--bg);
  }
  #todo-scroll::-webkit-scrollbar { display: none; }

  #todo-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ── TODO CARD ── */
  .todo-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    position: relative;
    overflow: hidden;
    cursor: default;
  }
  .card-main { user-select: none; }
  .card-drag-handle { cursor: grab; }
  .card-drag-handle:active { cursor: grabbing; }
  .card-expanded { user-select: text; cursor: default; }
  .card-expanded * { -webkit-user-select: text; user-select: text; }
  .inline-edit-content { -webkit-user-modify: read-write; }
  .inline-edit-content.multiline {
    display: block;
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 400;
    color: var(--text-2);
    line-height: 1.6;
    min-height: 60px;
    padding: 6px 10px;
    background: var(--surface2);
    border: 0.5px solid var(--accent-border);
    border-radius: var(--radius-xs);
    outline: none;
    resize: none;
    overflow: hidden;
    white-space: pre-wrap;
    caret-color: var(--accent);
  }
  .inline-edit-content.multiline:focus {
    border-color: var(--accent);
    background: var(--surface);
  }

  .todo-card:hover { border-color: var(--border2); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .todo-card.inactive-today { opacity: 0.45; }
  .todo-card.inactive-today .card-checkbox { pointer-events: none; }
  .todo-card.inactive-today .card-drag-handle { opacity: 0.1; cursor: default; pointer-events: none; }
  .todo-card.dragging {
    opacity: 0.5;
    transform: scale(0.98);
    border-color: var(--accent-border);
  }
  .todo-card.drag-over { border-color: var(--accent-border); background: var(--accent-dim); }
  .todo-card.pinned { cursor: default; }
  .todo-card.expanded { border-color: var(--border2); background: var(--surface); }

  .todo-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: var(--card-color, transparent);
    border-radius: 3px 0 0 3px;
    transition: width 0.18s ease;
  }
  .todo-card.expanded::before {
    width: 3px;
  }

  .card-main {
    padding: 11px 12px 11px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-drag-handle {
    flex-shrink: 0;
    width: 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    opacity: 0.2;
    transition: opacity var(--transition);
    padding: 2px 0;
    user-select: none;
  }
  .todo-card:hover .card-drag-handle { opacity: 0.4; }
  .todo-card.pinned .card-drag-handle { opacity: 0.1; }
  .card-drag-handle span {
    display: block;
    height: 1.5px;
    background: var(--text);
    border-radius: 2px;
  }

  .card-checkbox {
    width: 17px; height: 17px;
    border: 1.5px solid var(--border2);
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    transition: all var(--transition);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .card-checkbox:hover { border-color: var(--accent); }
  .card-checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .card-checkbox.checked::after {
    content: '';
    width: 6px; height: 4px;
    border-left: 1.5px solid #fff;
    border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
  }

  .card-title-wrap { flex: 1; min-width: 0; }
  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color var(--transition);
  }
  .todo-card.repeat-overdue .card-title {
    text-decoration: line-through;
    color: var(--text-3);
  }
  .card-title.done { text-decoration: line-through; color: var(--text-3); }

  .card-meta-row {
    display: flex;
    gap: 5px;
    margin-top: 3px;
    flex-wrap: wrap;
  }

  .meta-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 20px;
    letter-spacing: 0.02em;
    font-weight: 500;
    line-height: 1.4;
    vertical-align: middle;
    display: inline-flex;
    align-items: center;
  }
  .meta-tag.status-active { background: var(--accent-dim); color: var(--accent); }
  .meta-tag.status-inactive { background: var(--surface3); color: var(--text-3); }
  .meta-tag.status-completed { background: var(--surface2); color: var(--text-3); }
  .meta-tag.status-archived { background: var(--surface2); color: var(--text-3); }
  .meta-tag.status-overdue { background: var(--red-dim); color: var(--red); }
  .meta-tag.status-notyet { background: var(--blue-dim); color: var(--blue); }
  .meta-tag.repeat { background: var(--teal-dim); color: var(--teal); }
  .meta-tag.repeat-daily { background: var(--blue-dim); color: var(--blue); }
  .meta-tag.repeat-weekly { background: var(--teal-dim); color: var(--teal); }
  .meta-tag.repeat-monthly { background: var(--purple-dim); color: var(--purple); }
  .meta-tag.deadline { background: var(--amber-dim); color: var(--amber); }
  .meta-tag.template { background: var(--purple-dim); color: var(--purple); }

  .card-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .pin-btn {
    width: 24px; height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    padding: 0;
    opacity: 0;
    transition: opacity var(--transition), color var(--transition);
  }
  .todo-card:hover .pin-btn { opacity: 1; }
  .pin-btn.pinned { color: var(--amber); opacity: 1; }
  .pin-btn svg { width: 13px; height: 13px; }

  .expand-btn {
    width: 24px; height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    display: flex; align-items: center; justify-content: center;
    transition: color var(--transition);
    border-radius: 4px;
  }
  .expand-btn:hover { color: var(--text-2); }
  .expand-btn svg {
    width: 12px; height: 12px;
    transition: transform var(--transition);
  }
  .todo-card.expanded .expand-btn svg { transform: rotate(180deg); }

  /* ── EXPANDED PANEL ── */
  .card-expanded {
    display: none;
    padding: 0 16px 14px 16px;
    border-top: 0.5px solid var(--border);
  }
  .card-expanded.open { display: block; }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .meta-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .meta-field label {
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .meta-field input, .meta-field select {
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color var(--transition);
    width: 100%;
    appearance: auto;
  }
  .meta-field input:focus, .meta-field select:focus {
    border-color: var(--accent);
  }
  .meta-field input[type="date"]:focus { border-color: var(--accent-border); }
  .meta-field select option { background: var(--surface); }
  .meta-field.full-width { grid-column: 1 / -1; }

  .color-picker-row { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .color-dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color var(--transition), transform var(--transition);
    flex-shrink: 0;
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: var(--text); }
  .color-dot-custom { overflow: hidden; }

  .template-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle-switch {
    width: 36px; height: 20px;
    background: var(--surface3);
    border: 0.5px solid var(--border2);
    border-radius: 10px;
    position: relative;
    transition: background var(--transition);
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--accent-dim); border-color: var(--accent-border); }
  .toggle-switch::after {
    content: '';
    width: 14px; height: 14px;
    background: var(--text-3);
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
    transition: transform var(--transition), background var(--transition);
  }
  .toggle-switch.on::after { transform: translateX(16px); background: var(--accent); }
  .template-toggle span { font-size: 13px; color: var(--text-2); }

  .expanded-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 0.5px solid var(--border);
  }
  .action-btn {
    font-size: 12px;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    transition: all var(--transition);
    font-family: var(--font-body);
  }
  .action-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .action-btn.danger:hover { border-color: rgba(163,45,45,0.4); color: var(--red); background: var(--red-dim); }
  .action-btn.archive:hover { border-color: rgba(133,79,11,0.4); color: var(--amber); background: var(--amber-dim); }
  .action-btn.archive.disabled { opacity: 0.3; cursor: not-allowed; }
  .action-btn.archive.disabled:hover { border-color: var(--border2); color: var(--text-2); background: transparent; }
  .action-btn.danger.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .action-btn.save { margin-left: auto; }
  .action-btn.repeat-close { border-color: var(--blue-dim); color: var(--blue); }
  .action-btn.repeat-close:hover { border-color: var(--blue); background: var(--blue-dim); color: var(--blue); }
  .action-btn.repeat-close.disabled,
  .action-btn.repeat-close[disabled] {
    opacity: 0.3;
    cursor: not-allowed;
    pointer-events: none;
    border-color: var(--border2);
    color: var(--text-3);
  }

  /* SECTION LABEL */
  .section-label {
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }

  /* ── EMPTY STATE ── */
  #empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 60px 20px;
    color: var(--text-3);
    text-align: center;
  }
  #empty-state.show { display: flex; }
  #empty-state .empty-icon { font-size: 32px; color: var(--surface3); }
  #empty-state p { font-size: 13px; color: var(--text-3); }

  /* ── FAB & CLOSE BTN ── */
  #fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(calc(-100% - 6px));
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(83,74,183,0.30);
    transition: transform var(--transition), box-shadow var(--transition);
    z-index: 100;
  }
  #fab:hover { transform: translateX(calc(-100% - 6px)) scale(1.06); box-shadow: 0 4px 20px rgba(83,74,183,0.40); }
  #fab:active { transform: translateX(calc(-100% - 6px)) scale(0.96); }
  #fab svg { width: 22px; height: 22px; color: #fff; }

  #close-btn {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(6px);
    width: 52px; height: 52px;
    background: var(--surface);
    border-radius: 50%;
    border: 0.5px solid var(--border2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform var(--transition), background var(--transition);
    z-index: 100;
    color: var(--text-2);
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  #close-btn:hover { transform: translateX(6px) scale(1.06); background: var(--surface2); color: var(--accent); }
  #close-btn:active { transform: translateX(6px) scale(0.96); }
  #close-btn svg { width: 20px; height: 20px; }

/* ── EXPANDED INLINE EDIT ── */
  .expanded-view-mode { padding: 10px 0 8px; }
  .expanded-title-display {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .expanded-detail-display {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .expanded-detail-display.empty { color: var(--text-3); font-style: italic; }
  /* 마크다운 렌더링 스타일 */
  .expanded-detail-display.md-rendered p { margin-bottom: 6px; }
  .expanded-detail-display.md-rendered p:last-child { margin-bottom: 0; }
  .expanded-detail-display.md-rendered strong { color: var(--text); font-weight: 600; }
  .expanded-detail-display.md-rendered em { font-style: italic; }
  .expanded-detail-display.md-rendered del { color: var(--text-3); }
  .expanded-detail-display.md-rendered code {
    font-family: monospace; font-size: 11px;
    background: var(--surface3); color: var(--accent);
    padding: 1px 5px; border-radius: 3px;
  }
  .expanded-detail-display.md-rendered pre {
    background: var(--surface3); border-radius: var(--radius-xs);
    padding: 8px 10px; overflow-x: auto; margin: 6px 0;
  }
  .expanded-detail-display.md-rendered pre code { background:none; padding:0; font-size:12px; color:var(--text-2); }
  .expanded-detail-display.md-rendered ul,
  .expanded-detail-display.md-rendered ol { padding-left: 16px; margin: 4px 0; }
  .expanded-detail-display.md-rendered li { margin-bottom: 2px; }
  .expanded-detail-display.md-rendered blockquote {
    border-left: 3px solid var(--accent-border); padding-left: 10px;
    margin: 6px 0; color: var(--text-3); font-style: italic;
  }
  .expanded-detail-display.md-rendered h1,
  .expanded-detail-display.md-rendered h2,
  .expanded-detail-display.md-rendered h3 {
    color: var(--text); font-weight: 600; margin-bottom: 4px; margin-top: 8px;
  }
  .expanded-detail-display.md-rendered h1 { font-size: 16px; }
  .expanded-detail-display.md-rendered h2 { font-size: 14px; }
  .expanded-detail-display.md-rendered h3 { font-size: 13px; }
  .expanded-detail-display.md-rendered a { color: var(--blue); text-decoration: underline; }
  .expanded-detail-display.md-rendered hr { border:none; border-top:0.5px solid var(--border2); margin:8px 0; }

  #mock-set-btn, #mock-reset-btn, #mock-hide-btn { font-size: 10px; padding: 3px 8px; border-radius: var(--radius-xs); border: 0.5px solid var(--border2); background: transparent; color: var(--text-2); cursor: pointer; transition: all var(--transition); }

  /* ── CARD ANIMATIONS ── */
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

</style>

// ── MARKDOWN SERVICE (계층 분리 — 제거/교체 용이) ────────────────────
const MarkdownService = (() => {
  const isAvailable = () => typeof window.marked !== 'undefined' && typeof window.DOMPurify !== 'undefined';

  const render = (text) => {
    if (!text) return '';
    if (!isAvailable()) return escHtml(text).replace(/\n/g, '<br>');
    try {
      const rawHtml = window.marked.parse(text, {
        breaks: true,
        gfm: true,
        headerIds: false,
        mangle: false,
      });
      return window.DOMPurify.sanitize(rawHtml, {
        ALLOWED_TAGS: ['p','br','strong','em','del','ul','ol','li',
                       'blockquote','code','pre','h1','h2','h3','h4',
                       'a','hr','table','thead','tbody','tr','th','td'],
        ALLOWED_ATTR: ['href','target','rel'],
      });
    } catch {
      return escHtml(text).replace(/\n/g, '<br>');
    }
  };

  const isEnabled = () => isAvailable();
  return { render, isEnabled };
})();

// ── MOCK CLOCK (테스트용) ─────────────────────────────────────────
const MockClock = (() => {
  let _mockDate = null;
  const now = () => _mockDate ? new Date(_mockDate) : new Date();
  const set = (d) => { _mockDate = d ? new Date(d) : null; };
  const isActive = () => _mockDate !== null;
  const PANEL_KEY = 'mock_panel_hidden';
  const isPanelHidden = () => localStorage.getItem(PANEL_KEY) === 'true';
  const setPanelHidden = (v) => localStorage.setItem(PANEL_KEY, v ? 'true' : 'false');
  return { now, set, isActive, isPanelHidden, setPanelHidden };
})();

// ── STATS REPOSITORY ──────────────────────────────────────────────
// 반복 todo 완료 기록: { [itemId]: { [periodKey]: bool } }
// periodKey: 'daily:2025-01-15' | 'weekly:2025-W03' | 'monthly:2025-01'
const StatsRepository = (() => {
  const KEY = 'todo_stats_v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const write = (d) => localStorage.setItem(KEY, JSON.stringify(d));

  // 로컬 날짜를 'YYYY-MM-DD' 문자열로 변환 (UTC 아닌 로컬 기준)
  const localDateStr = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  };

  // 로컬 기준 ISO 주차 계산
  const localISOWeek = (d) => {
    const tmp = new Date(d.getFullYear(), d.getMonth(), d.getDate()); // 로컬 자정
    const dayOfWeek = tmp.getDay() || 7; // 1=Mon ... 7=Sun
    tmp.setDate(tmp.getDate() + 4 - dayOfWeek); // 해당 주의 목요일
    const jan1 = new Date(tmp.getFullYear(), 0, 1);
    const w = Math.ceil(((tmp - jan1) / 86400000 + 1) / 7);
    return `${tmp.getFullYear()}-W${String(w).padStart(2, '0')}`;
  };

  const getPeriodKey = (repeat, date) => {
    const d = date || MockClock.now();
    if (!repeat) return null;
    if (repeat === 'Daily') return 'daily:' + localDateStr(d);
    if (repeat === 'Weekly') return 'weekly:' + localISOWeek(d);
    if (repeat === 'Monthly') return `monthly:${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    // DayOfWeek/DayOfMonth: 날짜 기반 키 (주차가 아닌 해당 날짜로 구분)
    if (repeat && (repeat.startsWith('DayOfWeek:') || repeat.startsWith('DayOfMonth:'))) {
      return 'date:' + localDateStr(d);
    }
    return null;
  };

  const mark = (itemId, repeat, done) => {
    const key = getPeriodKey(repeat);
    if (!key) return;
    const data = read();
    if (!data[itemId]) data[itemId] = {};
    data[itemId][key] = done;
    write(data);
  };

  const isCompletedThisPeriod = (itemId, repeat) => {
    const key = getPeriodKey(repeat);
    if (!key) return false;
    const data = read();
    return !!(data[itemId] && data[itemId][key]);
  };

  const getHistory = (itemId, repeat, periodsBack = 12) => {
    const data = read();
    const history = data[itemId] || {};
    const result = [];
    const now = MockClock.now();
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const isWeekBased = repeat && (repeat === 'Weekly');
    const isDateBased = !!(repeat && (repeat.startsWith('DayOfWeek:') || repeat.startsWith('DayOfMonth:')));

    for (let i = periodsBack - 1; i >= 0; i--) {
      let d;
      if (repeat === 'Daily') {
        d = new Date(base); d.setDate(base.getDate() - i);
      } else if (isWeekBased) {
        d = new Date(base); d.setDate(base.getDate() - i * 7);
      } else if (repeat === 'Monthly') {
        d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      } else if (isDateBased) {
        // 날짜 기반: 하루씩 순회하되 해당 요일/일자인 날만 포함
        d = new Date(base); d.setDate(base.getDate() - i);
        // 해당 날짜/요일이 아니면 스킵
        if (repeat.startsWith('DayOfWeek:')) {
          const days = repeat.slice(10).split(',').map(Number);
          if (!days.includes(d.getDay())) continue;
        } else if (repeat.startsWith('DayOfMonth:')) {
          const dates = repeat.slice(11).split(',').map(Number);
          if (!dates.includes(d.getDate())) continue;
        }
      } else {
        continue;
      }
      const key = getPeriodKey(repeat, d);
      result.push({ key, done: !!(history[key]), date: d });
    }
    return result;
  };

  const getAllForItem = (itemId) => {
    const data = read();
    return data[itemId] || {};
  };

  return { mark, isCompletedThisPeriod, getHistory, getPeriodKey, getAllForItem };
})();


// ── DATA LAYER (Repository Pattern) ──────────────────────────────
const TodoRepository = (() => {
  const STORAGE_KEY = 'todo_items_v1';
  const ORDER_KEY = 'todo_order_v1';

  // These can be swapped for any backend adapter
  const adapter = {
    read: () => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    },
    write: (items) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    },
    readOrder: () => {
      try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; }
      catch { return []; }
    },
    writeOrder: (order) => {
      localStorage.setItem(ORDER_KEY, JSON.stringify(order));
    }
  };

  const getAll = () => adapter.read();
  const getOrder = () => adapter.readOrder();

  const save = (items) => adapter.write(items);
  const saveOrder = (order) => adapter.writeOrder(order);

  const create = (data) => {
    const items = getAll();
    const newItem = {
      id: `todo_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      title: data.title || '',
      detail: data.detail || '',
      pinned: false,
      meta: {
        status: data.meta?.status || 'Active',
        repeat: data.meta?.repeat || null,
        deadline: data.meta?.deadline || null,
        startDate: data.meta?.startDate || null,
        memorable: data.meta?.memorable || false,
        paused: false,
        color: data.meta?.color || '',
      },
      trackers: data.trackers || [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    items.push(newItem);
    save(items);

    const order = getOrder();
    order.push(newItem.id);
    saveOrder(order);

    return newItem;
  };

  const update = (id, patch) => {
    const items = getAll();
    const idx = items.findIndex(i => i.id === id);
    if (idx === -1) return null;
    const updatedItem = { ...items[idx], ...patch, updatedAt: new Date().toISOString() };
    if (patch.meta) {
      // 기존 meta를 먼저 두고 patch.meta로 덮어쓰기 — repeat 등 미지정 필드는 보존
      updatedItem.meta = { ...items[idx].meta, ...patch.meta };
    }
    items[idx] = updatedItem;
    save(items);
    return items[idx];
  };

  const remove = (id) => {
    let items = getAll();
    items = items.filter(i => i.id !== id);
    save(items);
    const order = getOrder().filter(oid => oid !== id);
    saveOrder(order);
  };

  const reorder = (newOrder) => saveOrder(newOrder);

  const getSorted = () => {
    const items = getAll();
    const order = getOrder();
    const map = Object.fromEntries(items.map(i => [i.id, i]));
    const ordered = order.map(id => map[id]).filter(Boolean);
    items.forEach(item => { if (!order.includes(item.id)) ordered.push(item); });
    return ordered;
  };

  return { getAll, getSorted, getOrder, create, update, remove, reorder };
})();

// ── BUSINESS LOGIC ────────────────────────────────────────────────
const TodoService = {
  checkOverdue: (item) => {
    if (!item.meta.deadline) return false;
    if (['Completed', 'Archived'].includes(item.meta.status)) return false;
    return new Date(item.meta.deadline) < MockClock.now();
  },

  checkNotYet: (item) => {
    if (!item.meta.startDate) return false;
    if (['Completed', 'Archived'].includes(item.meta.status)) return false;
    const start = new Date(item.meta.startDate);
    start.setHours(0, 0, 0, 0);
    const today = MockClock.now();
    today.setHours(0, 0, 0, 0);
    return start > today;
  },

  resolveStatus: (item) => {
    if (!item?.meta?.status) return 'Active';
    if (item.meta.status === 'Inactive') return 'Inactive';
    if (item.meta.status === 'Completed') return 'Completed';
    if (item.meta.status === 'Archived') return 'Archived';
    if (item.meta.status === 'Overdue') return 'Overdue';
    if (TodoService.checkNotYet(item)) return 'NotYet';
    return item.meta.status;
  },

  formatDate: (dateStr) => {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
  },

  toggle: (id) => {
    const items = TodoRepository.getAll();
    const item = items.find(i => i.id === id);
    if (!item || item.meta.status === 'Inactive') return;
    const newStatus = item.meta.status === 'Completed' ? 'Active' : 'Completed';
    // memorable은 절대 변경하지 않고 status만 업데이트
    return TodoRepository.update(id, { meta: { status: newStatus, memorable: item.meta.memorable } });
  }
};

// ── UI STATE ──────────────────────────────────────────────────────
let currentFilter = 'all';
let dragState = { dragging: null, placeholder: null };
let expandedId = null;
let selectedAddColor = '';
let addMemorableOn = false;
let addTrackers = [];

// 필터 상태
let visibleStatuses = new Set(
  JSON.parse(localStorage.getItem('visible_statuses') || '["active","completed","inactive"]')
);
function saveVisibleStatuses() {
  localStorage.setItem('visible_statuses', JSON.stringify([...visibleStatuses]));
}

// ── RENDER ────────────────────────────────────────────────────────
function getColorVar(colorVal) {
  if (!colorVal) return '';
  // CSS 변수는 런타임에 실제 색상값으로 변환
  if (colorVal.startsWith('var(')) {
    const tmp = document.createElement('div');
    tmp.style.color = colorVal;
    document.body.appendChild(tmp);
    const computed = getComputedStyle(tmp).color;
    document.body.removeChild(tmp);
    // rgb(r,g,b) → #rrggbb
    const m = computed.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
    if (m) return '#' + [m[1],m[2],m[3]].map(n=>parseInt(n).toString(16).padStart(2,'0')).join('');
  }
  return colorVal;
}

// 개시시간을 고려한 "실효 날짜" 반환 (개시시간 전이면 어제)
function getEffectiveNow() {
  const now = MockClock.now();
  const [h, m] = AppSession.getOpenTime().split(':').map(Number);
  const todayOpen = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
  if (now < todayOpen) {
    // 개시시간 전 → 어제를 실효 날짜로
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  }
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

function isInactiveToday(item) {
  // meta.status로만 판단 (checkDayTransitions가 이미 올바르게 세팅)
  return item.meta.status === 'Inactive';
}

function filterItems(items) {
  return items.filter(i => {
    if (i.meta.paused) return false;
    const s = TodoService.resolveStatus(i);
    if (s === 'Archived') return false;
    const inactive = isInactiveToday(i);
    if (inactive) return visibleStatuses.has('inactive');
    if (s === 'Completed' || s === 'NotYet') return visibleStatuses.has('completed');
    return visibleStatuses.has('active');
  });
}

function renderAll() {
  const allItems = TodoRepository.getSorted();
  const filtered = filterItems(allItems);

  const list = document.getElementById('todo-list');
  const empty = document.getElementById('empty-state');

  list.innerHTML = '';

  if (filtered.length === 0) {
    empty.classList.add('show');
  } else {
    empty.classList.remove('show');
  }

  filtered.forEach(item => list.appendChild(createCard(item)));

  updateStats(allItems);
  setupDragDrop();

  // 카드 확장 중이면 하단 버튼 숨김
  const hasExpanded = expandedId !== null;
  document.getElementById('fab').style.display = hasExpanded ? 'none' : '';
  document.getElementById('close-btn').style.display = hasExpanded ? 'none' : '';
}

function createCard(item) {
  const status = TodoService.resolveStatus(item);
  const isDone = item.meta.status === 'Completed';
  const colorHex = getColorVar(item.meta.color);

  const card = document.createElement('div');
  const isRepeatOverdue = item.meta.repeat && TodoService.resolveStatus(item) === 'Overdue';
  card.className = `todo-card${item.pinned ? ' pinned' : ''}${expandedId === item.id ? ' expanded' : ''}${isInactiveToday(item) ? ' inactive-today' : ''}${isRepeatOverdue ? ' repeat-overdue' : ''}`;
  card.dataset.id = item.id;
  if (colorHex) card.style.setProperty('--card-color', colorHex);

  // Build meta tags
  const statusLabel = { Active: '진행 중', Completed: '완료됨', Overdue: '기한 도과', NotYet: '시작 전', Archived: '보관됨' };
  const todayInactive = isInactiveToday(item);
  let metaTagsHTML = '';
  if (todayInactive) {
    metaTagsHTML += `<span class="meta-tag status-inactive">비활성화</span>`;
  } else {
    metaTagsHTML += `<span class="meta-tag status-${status.toLowerCase()}">${statusLabel[status] || status}</span>`;
  }
  if (item.meta.repeat) {
    const rClass = repeatClass(item.meta.repeat);
    metaTagsHTML += `<span class="meta-tag ${rClass}">${repeatLabel(item.meta.repeat)}</span>`;
    // 이번 기간 마감 기록이 있으면 '마감' 배지
    const curKey = StatsRepository.getPeriodKey(item.meta.repeat);
    const recorded = StatsRepository.getAllForItem(item.id);
    if (curKey && curKey in recorded) {
      const isDone = recorded[curKey];
      metaTagsHTML += `<span class="meta-tag" style="font-size:9px;padding:1px 5px;vertical-align:middle;${isDone ? 'background:var(--accent-dim);color:var(--accent)' : 'background:var(--red-dim);color:var(--red)'}">마감</span>`;
    }
  }
  if (item.meta.memorable) metaTagsHTML += `<span class="meta-tag template">보관하기</span>`;
  if (item.meta.deadline) {
    const df = TodoService.formatDate(item.meta.deadline);
    metaTagsHTML += `<span class="meta-tag deadline">${df}</span>`;
  }

  card.innerHTML = `
    <div class="card-main">
      <div class="card-drag-handle" data-drag>
        <span></span><span></span><span></span>
      </div>
      <div class="card-checkbox${isDone ? ' checked' : ''}${todayInactive ? ' disabled' : ''}" data-toggle style="${todayInactive ? 'pointer-events:none;opacity:0.35;cursor:not-allowed' : ''}"></div>
      <div class="card-title-wrap">
        <div class="card-title${isDone ? ' done' : ''}">${escHtml(item.title)}</div>
        <div class="card-meta-row">${metaTagsHTML}</div>
      </div>
      <div class="card-right">

        <button class="expand-btn" data-expand>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="card-expanded${expandedId === item.id ? ' open' : ''}">
      ${renderExpandedPanel(item)}
    </div>
  `;

  // Wire events
  // 체크박스 클릭 (싱글) — 더블클릭과 구분하기 위해 딜레이 적용
  let clickTimer = null;
  card.querySelector('[data-toggle]').addEventListener('click', (e) => {
    e.stopPropagation();
    if (isInactiveToday(item)) return; // 비활성화 투두 완료 처리 차단
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      TodoService.toggle(item.id);
      renderAll();
    }, 220);
  });

  // 더블클릭으로 Active ↔ Completed 토글 (비활성화 투두 제외)
  card.querySelector('.card-main').addEventListener('dblclick', (e) => {
    if (e.target.closest('[data-pin],[data-toggle],[data-expand]')) return;
    if (isInactiveToday(item)) return;
    e.stopPropagation();
    clearTimeout(clickTimer); // 싱글클릭 타이머 취소
    TodoService.toggle(item.id);
    renderAll();
  });



  card.querySelector('[data-expand]').addEventListener('click', (e) => {
    e.stopPropagation();
    expandedId = expandedId === item.id ? null : item.id;
    renderAll();
  });

  // Wire expanded panel events
  if (expandedId === item.id) {
    wireExpandedPanel(card, item);
  }



  return card;
}

function renderExpandedPanel(item) {
  const colorDots = [
    { val: '', bg: 'var(--surface3)', label: '없음', border: 'var(--text)' },
    { val: 'var(--palette-red)', bg: 'var(--palette-red)', label: 'Red' },
    { val: 'var(--palette-green)', bg: 'var(--palette-green)', label: 'Green' },
    { val: 'var(--palette-yellow)', bg: 'var(--palette-yellow)', label: 'Yellow' },
    { val: 'var(--palette-blue)', bg: 'var(--palette-blue)', label: 'Blue' },
    { val: 'var(--palette-magenta)', bg: 'var(--palette-magenta)', label: 'Magenta' },
    { val: 'var(--palette-cyan)', bg: 'var(--palette-cyan)', label: 'Cyan' },
  ];
  const statusLabel = { Active: '진행 중', Inactive: '비활성화', Completed: '완료됨', Overdue: '기한 도과', NotYet: '시작 전', Archived: '보관됨' };
  const resolvedStatus = TodoService.resolveStatus(item);
  const isCustomColor = item.meta.color && !colorDots.some(c => c.val === item.meta.color);
  const colorDotsHtml = colorDots.map(c =>
    '<div class="color-dot' + (item.meta.color === c.val ? ' selected' : '') + '"' +
    ' data-color-val="' + c.val + '"' +
    ' style="background:' + c.bg + (c.border ? ';border-color:' + c.border : '') + '"' +
    ' title="' + c.label + '"></div>'
  ).join('') +
  '<div class="color-dot color-dot-custom' + (isCustomColor ? ' selected' : '') + '" data-color-val="__custom__" title="커스텀"' +
  ' style="background:' + (isCustomColor ? item.meta.color : 'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)') + ';border:' + (isCustomColor ? '' : 'none') + ';position:relative;overflow:hidden">' +
  '<input type="color" class="color-custom-input" value="' + (isCustomColor ? item.meta.color : '#888888') + '" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;padding:0"></div>';
  const repeatHtml = item.meta.repeat
    ? '<span class="meta-tag ' + repeatClass(item.meta.repeat) + '" style="font-size:11px;padding:3px 8px">' + repeatLabel(item.meta.repeat) + '</span>'
    : '<span style="font-size:12px;color:var(--text-3)">없음</span>';

  return `
    <div class="expanded-view-mode">
      <p class="expanded-title-display">${escHtml(item.title)}</p>
      <div class="expanded-detail-display" data-md-detail></div>
    </div>
    <div class="expanded-edit-mode" style="display:none">
      <div class="inline-edit-field">
        <div class="inline-edit-label">제목</div>
        <div class="inline-edit-content" data-field="title" contenteditable="true" inputmode="text">${escHtml(item.title)}</div>
      </div>
      <div class="inline-edit-field">
        <div class="inline-edit-label">상세</div>
        <textarea class="inline-edit-content multiline" data-field="detail" placeholder="상세 내용 (마크다운 지원)" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="meta-grid">
      <div class="meta-field">
        <label>상태</label>
        <div style="display:flex;align-items:center;height:30px">
          <span class="meta-tag status-${resolvedStatus.toLowerCase()}" style="font-size:11px;padding:3px 8px">${statusLabel[resolvedStatus] || resolvedStatus}</span>
        </div>
      </div>
      <div class="meta-field">
        <label>반복</label>
        <div style="display:flex;align-items:center;height:30px">${repeatHtml}</div>
      </div>
      <div class="meta-field">
        <label>시작일</label>
        <input type="date" data-field="startDate" value="${item.meta.startDate || ''}" ${item.meta.repeat ? 'disabled style="opacity:0.35;cursor:not-allowed"' : ''}>
      </div>
      <div class="meta-field">
        <label>종료일</label>
        <input type="date" data-field="deadline" value="${item.meta.deadline || ''}" ${item.meta.repeat ? 'disabled style="opacity:0.35;cursor:not-allowed"' : ''}>
      </div>
      <div class="meta-field full-width">
        <label>색상</label>
        <div class="color-picker-row" data-color-picker>${colorDotsHtml}</div>
      </div>
      <div class="meta-field full-width">
        <label>설정</label>
        <label class="template-toggle" style="cursor:pointer">
          <div class="toggle-switch${item.meta.memorable ? ' on' : ''}" data-template-switch></div>
          <span>보관하기</span>
        </label>
      </div>
    </div>
    <div class="expanded-actions">
      <button class="action-btn danger${item.meta.repeat ? ' disabled' : ''}" data-delete ${item.meta.repeat ? 'disabled' : ''}>삭제</button>
      <button class="action-btn archive${item.meta.memorable ? '' : ' disabled'}" data-archive ${item.meta.memorable ? '' : 'disabled'}>보관</button>
      ${item.meta.repeat ? '<button class="action-btn repeat-close' + (item.meta.status === 'Inactive' ? ' disabled' : '') + '" data-repeat-close' + (item.meta.status === 'Inactive' ? ' disabled' : '') + '>개별 마감</button>' : ''}
      <button class="action-btn save" data-save data-editing="false">수정</button>
    </div>
  `;
}

function wireExpandedPanel(card, item) {
  // Memorable switch
  const tSwitch = card.querySelector('[data-template-switch]');
  if (tSwitch) {
    let memorableVal = item.meta.memorable;
    // 반복형이면 보관하기 비활성화
    if (item.meta.repeat) {
      tSwitch.style.opacity = '0.35';
      tSwitch.style.pointerEvents = 'none';
      const tLabel = card.querySelector('.template-toggle');
      if (tLabel) { tLabel.style.opacity = '0.35'; tLabel.style.pointerEvents = 'none'; }
    }

    tSwitch.addEventListener('click', () => {
      memorableVal = !memorableVal;
      tSwitch.classList.toggle('on', memorableVal);
      const archiveBtn = card.querySelector('[data-archive]');
      if (archiveBtn) {
        archiveBtn.disabled = !memorableVal;
        archiveBtn.classList.toggle('disabled', !memorableVal);
      }
      // 즉시 저장
      item.meta.memorable = memorableVal;
      TodoRepository.update(item.id, { meta: { ...item.meta, memorable: memorableVal } });
      // 카드 상단 meta-row의 Memorable 배지 즉시 업데이트
      const metaRow = card.querySelector('.card-meta-row');
      if (metaRow) {
        const existing = metaRow.querySelector('.meta-tag.template');
        if (memorableVal && !existing) {
          const badge = document.createElement('span');
          badge.className = 'meta-tag template';
          badge.textContent = '보관하기';
          metaRow.appendChild(badge);
        } else if (!memorableVal && existing) {
          existing.remove();
        }
      }
    });
    tSwitch._getVal = () => memorableVal;
  }

  // Color picker — 클릭 즉시 저장
  const colorDots = card.querySelectorAll('[data-color-picker] .color-dot');
  let selectedColor = item.meta.color;

  const applyColor = (val) => {
    selectedColor = val;
    item.meta.color = val;
    TodoRepository.update(item.id, { meta: { ...item.meta, color: val } });
    const hex = getColorVar(val);
    if (hex) card.style.setProperty('--card-color', hex);
    else card.style.removeProperty('--card-color');
  };

  colorDots.forEach(dot => {
    // 커스텀 컬러 input 처리
    const customInput = dot.querySelector('.color-custom-input');
    if (customInput) {
      customInput.addEventListener('input', (e) => {
        e.stopPropagation();
        const hex = e.target.value;
        dot.style.background = hex;
        colorDots.forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        applyColor(hex);
      });
    }
    dot.addEventListener('click', (e) => {
      if (e.target.classList.contains('color-custom-input')) return;
      const val = dot.dataset.colorVal;
      if (val === '__custom__') { dot.querySelector('.color-custom-input')?.click(); return; }
      colorDots.forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      applyColor(val);
    });
  });

    // 추적기 렌더
  renderTrackers(card, item);

  // date input — 변경 즉시 저장 + scrollIntoView
  card.querySelectorAll('input[type="date"]').forEach(el => {
    el.addEventListener('focus', () => {
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 320);
    });
    el.addEventListener('change', () => {
      const field = el.dataset.field;
      item.meta[field] = el.value || null;
      TodoRepository.update(item.id, { meta: { ...item.meta, [field]: el.value || null } });
    });
  });

  // Memorable switch — 즉시 저장 (기존 클릭 핸들러는 tSwitch에 있고, 여기서 추가)

  // 수정/저장 토글 버튼
  const saveBtn = card.querySelector('[data-save]');
  const viewMode = card.querySelector('.expanded-view-mode');
  const editMode = card.querySelector('.expanded-edit-mode');
  const titleField = card.querySelector('[data-field="title"]');
  const detailField = card.querySelector('[data-field="detail"]');

  // 뷰모드 detail 렌더링 (marked.js)
  const detailDisplayEl = card.querySelector('[data-md-detail]');
  if (detailDisplayEl) {
    if (item.detail) {
      detailDisplayEl.innerHTML = MarkdownService.render(item.detail);
      detailDisplayEl.classList.toggle('md-rendered', MarkdownService.isEnabled());
    } else {
      detailDisplayEl.textContent = '상세 내용 없음';
      detailDisplayEl.classList.add('empty');
    }
  }

  // textarea에 기존 내용 세팅
  if (detailField && detailField.tagName === 'TEXTAREA') {
    detailField.value = item.detail || '';
    detailField.style.height = 'auto';
    detailField.style.height = detailField.scrollHeight + 'px';
    detailField.addEventListener('input', () => {
      detailField.style.height = 'auto';
      detailField.style.height = detailField.scrollHeight + 'px';
    });
  }

  // contenteditable 필드 포커스 시 키보드가 가리지 않도록 scrollIntoView
  [titleField, detailField].forEach(el => {
    if (!el) return;
    el.addEventListener('focus', () => {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 320);
    });
  });



  saveBtn?.addEventListener('click', () => {
    const isEditing = saveBtn.dataset.editing === 'true';

    if (!isEditing) {
      // 수정 모드 진입
      viewMode.style.display = 'none';
      editMode.style.display = 'block';
      saveBtn.textContent = '저장';
      saveBtn.dataset.editing = 'true';
      // 제목 필드에 포커스 + 커서 끝으로
      if (titleField) {
        titleField.focus();
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(titleField);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } else {
      // 저장 — 텍스트만 업데이트, collapse하지 않음
      const titleVal = (titleField?.innerText || '').trim();
      const detailVal = (detailField?.value || '').trimEnd();
      const memorable = tSwitch?._getVal() ?? item.meta.memorable;

      if (titleVal) {
        // item 객체를 in-place 업데이트하여 재렌더 없이 상태 유지
        item.title = titleVal;
        item.detail = detailVal;
        item.meta.memorable = memorable;
        TodoRepository.update(item.id, { title: titleVal, detail: detailVal, meta: { ...item.meta, memorable } });

        // 뷰모드 텍스트만 갱신, collapse 안 함
        const viewTitle = card.querySelector('.expanded-title-display');
        const viewDetail = card.querySelector('.expanded-detail-display');
        if (viewTitle) viewTitle.textContent = titleVal;
        if (viewDetail) {
          if (detailVal) {
            viewDetail.innerHTML = MarkdownService.render(detailVal);
            viewDetail.classList.remove('empty');
            viewDetail.classList.toggle('md-rendered', MarkdownService.isEnabled());
          } else {
            viewDetail.textContent = '상세 내용 없음';
            viewDetail.classList.add('empty');
            viewDetail.classList.remove('md-rendered');
          }
        }
        // 카드 헤더 제목도 갱신
        const cardTitle = card.querySelector('.card-title');
        if (cardTitle) cardTitle.textContent = titleVal;

        // 수정 모드 → 보기 모드 전환 (collapse 없이)
        viewMode.style.display = '';
        editMode.style.display = 'none';
        saveBtn.textContent = '수정';
        saveBtn.dataset.editing = 'false';
      }
    }
  });

  // 제목 필드: Enter 키로 저장 (줄바꿈 X)
  titleField?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
  });
  // 상세 필드: Enter는 줄바꿈 허용, Shift+Enter도 동일
  detailField?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      // 기본 동작(줄바꿈) 허용 — 별도 처리 없음
      e.stopPropagation();
    }
  });

  // Delete
  card.querySelector('[data-delete]')?.addEventListener('click', () => {
    TodoRepository.remove(item.id);
    expandedId = null;
    renderAll();
  });

  // Archive
  card.querySelector('[data-archive]')?.addEventListener('click', () => {
    TodoRepository.update(item.id, { meta: { status: 'Archived' } });
    expandedId = null;
    renderAll();
    renderArchive();
  });

  // 개별 마감 (반복형 전용)
  card.querySelector('[data-repeat-close]')?.addEventListener('click', () => {
    const fresh = TodoRepository.getAll().find(i => i.id === item.id);
    if (!fresh || fresh.meta.status === 'Inactive') return;
    const done = fresh.meta.status === 'Completed';
    StatsRepository.mark(item.id, item.meta.repeat, done);
    // 보고서 업데이트
    const effective = getEffectiveNow();
    ReportRepository.upsertItem(AppSession.dateKey(effective), effective.getDay(), fresh, done);
    showToast(done ? '완료로 기록됨' : '미완료로 기록됨');
    renderStats();
  });
}

function updateStats(items) {
  const active = items.filter(i => i.meta.status === 'Active' && !TodoService.checkOverdue(i)).length;
  const overdue = items.filter(i => TodoService.checkOverdue(i)).length;

  document.getElementById('stat-active').textContent = `${active} 진행 중`;
  const overdueEl = document.getElementById('stat-overdue');
  if (overdue > 0) {
    overdueEl.style.display = '';
    overdueEl.textContent = `${overdue} 기한 도과`;
  } else {
    overdueEl.style.display = 'none';
  }

  // 오늘 전체 마감 여부 배지
  const closedEl = document.getElementById('stat-closed');
  if (closedEl) {
    const lastClosed = AppSession.getLastClosed();
    const effective = getEffectiveNow();
    const effectiveKey = AppSession.dateKey(effective);
    // lastClosed도 effective 기준으로 판단
    let closedKey = null;
    if (lastClosed) {
      const lc = lastClosed;
      const [h, m] = AppSession.getOpenTime().split(':').map(Number);
      const lcOpen = new Date(lc.getFullYear(), lc.getMonth(), lc.getDate(), h, m, 0);
      const lcEffective = lc >= lcOpen
        ? new Date(lc.getFullYear(), lc.getMonth(), lc.getDate())
        : new Date(lc.getFullYear(), lc.getMonth(), lc.getDate() - 1);
      closedKey = AppSession.dateKey(lcEffective);
    }
    const closedToday = closedKey === effectiveKey;
    closedEl.style.display = closedToday ? 'flex' : 'none';
  }
}

// ── DRAG & DROP (pointer events — works on mobile & desktop) ────────
function setupDragDrop() {
  const list = document.getElementById('todo-list');
  const cards = [...list.querySelectorAll('.todo-card')];

  cards.forEach(card => {
    const handle = card.querySelector('.card-drag-handle');
    if (!handle) return;

    let startY = 0, startX = 0;
    let isDragging = false;
    let clone = null;
    let placeholder = null;
    let pointerId = null;

    const cardMain = card.querySelector('.card-main');
    const dragZone = cardMain || handle;

    // 드래그 영역 touch-action 설정 (브라우저 스크롤 간섭 방지)
    dragZone.style.touchAction = 'pan-y';
    handle.style.touchAction = 'none';

    dragZone.addEventListener('pointerdown', (e) => {
      if (e.currentTarget === cardMain) {
        const rect = cardMain.getBoundingClientRect();
        if (e.clientX - rect.left > 48) return;
      }
      if (card.classList.contains('expanded')) return;

      pointerId = e.pointerId;
      // pointer capture: 손가락이 요소 밖으로 나가도 이벤트 유지
      try { dragZone.setPointerCapture(pointerId); } catch {}

      e.preventDefault();
      e.stopPropagation();

      startY = e.clientY;
      startX = e.clientX;
      isDragging = false;

      const cardRect = card.getBoundingClientRect();

      const onMove = (ev) => {
        if (ev.pointerId !== pointerId) return;
        const dy = Math.abs(ev.clientY - startY);
        const dx = Math.abs(ev.clientX - startX);

        if (!isDragging && dy > 8) {
          isDragging = true;
          // touch-action: none으로 전환해서 스크롤 완전 차단
          dragZone.style.touchAction = 'none';

          clone = card.cloneNode(true);
          clone.style.cssText = `
            position: fixed;
            left: ${cardRect.left}px;
            top: ${cardRect.top}px;
            width: ${cardRect.width}px;
            opacity: 0.85;
            pointer-events: none;
            z-index: 1000;
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: none;
          `;
          document.body.appendChild(clone);

          placeholder = document.createElement('div');
          placeholder.className = 'drag-placeholder';
          placeholder.style.height = cardRect.height + 'px';
          list.insertBefore(placeholder, card);
          card.style.display = 'none';
          dragState = { dragging: card, placeholder };
        }

        if (!isDragging) return;

        const moveY = ev.clientY - startY;
        clone.style.top = (cardRect.top + moveY) + 'px';

        const siblings = [...list.children].filter(el =>
          el !== placeholder && el !== card && el.classList.contains('todo-card')
        );
        let insertBefore = null;
        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          if (ev.clientY < r.top + r.height / 2) { insertBefore = sib; break; }
        }
        if (insertBefore) list.insertBefore(placeholder, insertBefore);
        else list.appendChild(placeholder);
      };

      const onUp = (ev) => {
        if (ev && ev.pointerId !== pointerId) return;
        dragZone.removeEventListener('pointermove', onMove);
        dragZone.removeEventListener('pointerup', onUp);
        dragZone.removeEventListener('pointercancel', onUp);

        // touch-action 복원
        dragZone.style.touchAction = 'pan-y';
        handle.style.touchAction = 'none';

        if (isDragging && clone && placeholder) {
          clone.remove();
          card.style.display = '';
          list.insertBefore(card, placeholder);
          placeholder.remove();
          saveOrder();
        }
        dragState = { dragging: null, placeholder: null };
        isDragging = false;
        clone = null;
        placeholder = null;
        pointerId = null;
      };

      dragZone.addEventListener('pointermove', onMove);
      dragZone.addEventListener('pointerup', onUp);
      dragZone.addEventListener('pointercancel', onUp);
    });
  });
}

function renderArchive() {
  const items = TodoRepository.getAll().filter(i => i.meta.status === 'Archived');
  const list = document.getElementById('archive-list');
  const empty = document.getElementById('archive-empty');
  const pill = document.getElementById('archive-count-pill');

  list.innerHTML = '';
  pill.textContent = `${items.length}개`;

  if (items.length === 0) {
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  items.slice().reverse().forEach(item => {
    const colorHex = getColorVar(item.meta.color);
    const card = document.createElement('div');
    card.className = 'archive-card';
    if (colorHex) card.style.setProperty('--card-color', colorHex);

    const updatedDate = new Date(item.updatedAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });

    // 날짜 텍스트 포맷
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }) : null;
    const startStr = fmtDate(item.meta.startDate);
    const deadlineStr = fmtDate(item.meta.deadline);
    const metaLines = [
      startStr ? `<span><strong>시작</strong>${startStr}</span>` : '',
      deadlineStr ? `<span><strong>데드라인</strong>${deadlineStr}</span>` : '',
    ].filter(Boolean).join('');

    card.innerHTML = `
      <div class="archive-card-main">
        <div class="archive-card-title">${escHtml(item.title)}</div>
        <div class="archive-card-date">${updatedDate}</div>
        <button class="archive-expand-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
      </div>
      <div class="archive-card-detail">
        <p class="archive-detail-text${item.detail ? '' : ' empty'}">${item.detail ? escHtml(item.detail) : '내용 없음'}</p>
        ${metaLines ? `<div class="archive-meta-line">${metaLines}</div>` : ''}
        <div class="archive-card-actions">
          <button class="archive-restore-btn">복원</button>
          <button class="archive-delete-btn">삭제</button>
        </div>
      </div>
    `;

    card.querySelector('.archive-expand-btn').addEventListener('click', () => {
      card.classList.toggle('expanded');
    });
    card.querySelector('.archive-restore-btn').addEventListener('click', () => {
      const fresh = TodoRepository.getAll().find(i => i.id === item.id);

      renderArchive();
      renderAll();

    card.querySelector('.archive-delete-btn').addEventListener('click', () => {
      TodoRepository.remove(item.id);
      renderArchive();
      renderAll();
    });
    list.appendChild(card);
  });
}

// ── 마감 핵심 로직 (버튼 + 자동마감 공용) ─────────────────────────────────
function performClose(targetDate, _autoClose = false) {
  const now = targetDate || MockClock.now();
  const allItems = TodoRepository.getAll();
  const completedItems = allItems.filter(i => i.meta.status === 'Completed');
  // 매주/매달은 전체 마감 제외 — 개별 마감만 가능
  // Inactive/Archived/paused 제외
  const repeatItems = allItems.filter(i =>
    i.meta.repeat &&
    i.meta.repeat !== 'Weekly' &&
    i.meta.repeat !== 'Monthly' &&
    i.meta.status !== 'Archived' &&
    i.meta.status !== 'Inactive' &&
    !i.meta.paused
  );
  let archived = 0, deleted = 0, statRecorded = 0;

  repeatItems.forEach(item => {
    const r = item.meta.repeat;
    const shouldClose =
      (r === 'Daily') ||
      (r && r.startsWith('DayOfWeek:')) ||
      (r && r.startsWith('DayOfMonth:'));
    if (!shouldClose) return;

    const fresh = TodoRepository.getAll().find(i => i.id === item.id);
    if (!fresh) return;
    const done = fresh.meta.status === 'Completed';
    StatsRepository.mark(item.id, item.meta.repeat, done);

    if (done) {
      // 완료 → Completed 상태 유지 (개시시간 전 완료 보존)
      // 상태 변경 없음, 통계만 기록
    } else {
      // 미완료 → Overdue (빗금 표시)
      TodoRepository.update(item.id, { meta: { ...fresh.meta, status: 'Overdue', inactive: false, prevStatus: null } });
    }
    statRecorded++;
  });

  // 일반 TODO (반복 없는 것)
  // 종료일이 오늘인 미완료 비반복형 → Overdue
  const today = now;
  const todayStr = AppSession.dateKey(new Date(today.getFullYear(), today.getMonth(), today.getDate()));
  const nonRepeatAll = allItems.filter(i => !i.meta.repeat && i.meta.status !== 'Archived' && !i.meta.paused);
  const deadlineOverdue = [];
  nonRepeatAll.forEach(item => {
    if (item.meta.deadline && item.meta.deadline === todayStr && item.meta.status !== 'Completed') {
      TodoRepository.update(item.id, { meta: { ...item.meta, status: 'Overdue' } });
      deadlineOverdue.push(item);
    }
  });

  // 완료된 비반복형 → 삭제 또는 보관 (보고서에 먼저 기록)
  const nonRepeatDone = [];
  completedItems.filter(i => !i.meta.repeat).forEach(item => {
    nonRepeatDone.push(item);
    if (item.meta.memorable) {
      TodoRepository.update(item.id, { meta: { status: 'Archived' } });
      archived++;
    } else {
      TodoRepository.remove(item.id);
      deleted++;
    }
  });

  AppSession.setLastClosed(now);

  // 보고서 업데이트 (자동마감이 아닌 경우만)
  if (!_autoClose) {
    const effective = getEffectiveNow();
    const rDateKey = AppSession.dateKey(effective);
    const allNow = TodoRepository.getAll();

    // 반복형 완료 (Weekly/Monthly 제외)
    const repeatDone = allNow.filter(i =>
      i.meta.repeat && i.meta.status === 'Completed' &&
      !['Weekly', 'Monthly'].includes(i.meta.repeat)
    );
    // 반복형 미완료 (Overdue로 바뀐 것)
    const repeatMissed = repeatItems.filter(r2 => {
      const fresh = allNow.find(i => i.id === r2.id);
      return fresh && fresh.meta.status === 'Overdue';
    });

    // 비반복형 완료 (이미 삭제/보관됐으므로 미리 수집한 목록 사용)
    // 비반복형 미완료 (종료일 도과)
    const reportDone = [...repeatDone, ...nonRepeatDone];
    const reportMissed = [...repeatMissed, ...deadlineOverdue];

    if (reportDone.length + reportMissed.length > 0) {
      ReportRepository.upsert(rDateKey, effective.getDay(), reportDone, reportMissed);
    }
  }

  return { statRecorded, archived, deleted };
}

document.getElementById('close-btn').addEventListener('click', () => {
  const allItems = TodoRepository.getAll();
  const completedItems = allItems.filter(i => i.meta.status === 'Completed');
  const repeatItems = allItems.filter(i =>
    i.meta.repeat &&
    i.meta.repeat !== 'Weekly' &&
    i.meta.repeat !== 'Monthly' &&
    i.meta.status !== 'Archived' &&
    i.meta.status !== 'Inactive' &&
    !i.meta.paused
  );
  if (completedItems.length === 0 && repeatItems.length === 0) {
    showToast('처리할 TODO가 없어요');
    return;
  }
  const memorableItems = completedItems.filter(i => i.meta.memorable);
  const archiveCount = memorableItems.length;

  const modal = document.getElementById('confirm-modal');
  const countEl = document.getElementById('confirm-count');
  const descEl = document.getElementById('confirm-desc');
  if (countEl) countEl.textContent = archiveCount;
  if (descEl) {
    const now2 = MockClock.now();
    const dow2 = now2.getDay();
    const isLastDay2 = new Date(now2.getFullYear(), now2.getMonth()+1, 0).getDate() === now2.getDate();
    // 매주/매달은 개별 마감만 — 전체 마감에서 제외
    const closableRepeat = repeatItems.filter(i =>
      (i.meta.repeat === 'Daily') ||
      (i.meta.repeat && i.meta.repeat.startsWith('DayOfWeek:')) ||
      (i.meta.repeat && i.meta.repeat.startsWith('DayOfMonth:'))
    );
    const parts = [];
    if (closableRepeat.length > 0) parts.push(`반복 ${closableRepeat.length}개 기록`);
    if (archiveCount > 0) parts.push(`보관 ${archiveCount}개`);
    const nonMemo = completedItems.filter(i => !i.meta.repeat && !i.meta.memorable).length;
    if (nonMemo > 0) parts.push(`삭제 ${nonMemo}개`);
    descEl.innerHTML = parts.length > 0
      ? parts.join(' · ') + '<br><span style="font-size:11px;color:var(--text-3)">마감을 진행할까요?</span>'
      : '마감할 항목이 없어요';
  }
  modal.classList.add('open');

  document.getElementById('confirm-cancel').onclick = () => modal.classList.remove('open');
  document.getElementById('confirm-ok').onclick = () => {
    const { statRecorded, archived, deleted } = performClose(MockClock.now());
    modal.classList.remove('open');
    renderAll();
    renderStats();
    const parts = [];
    if (statRecorded) parts.push(`반복 ${statRecorded}개 기록됨`);
    if (archived) parts.push(`${archived}개 보관`);
    if (deleted) parts.push(`${deleted}개 삭제`);
    showToast(parts.join(', ') || '마감 완료');
  };
});

    toast.style.cssText = `
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);

function addTodo() {
  const title = titleInput.value.trim();
  if (!title) return;

  // 같은 이름의 투두 중복 체크
  const duplicate = TodoRepository.getAll().find(i =>
    i.title.trim() === title && i.meta.status !== 'Archived'
  );
  if (duplicate) {
    showToast('같은 이름의 TODO가 이미 있어요');
    titleInput.focus();
    return;
  }

  // 오늘 전체 마감 후 반복형 생성 시 안내 (토스트, 생성은 허용)
  const repeatValCheck = document.getElementById('add-repeat').value;
  if (repeatValCheck) {
    const lastClosed = AppSession.getLastClosed();
    const effective = getEffectiveNow();
    if (lastClosed && AppSession.dateKey(lastClosed) === AppSession.dateKey(effective)) {
      showToast('오늘 마감 이후 생성된 반복 TODO예요. 개별 마감으로 이번 주기를 마감해 주세요.');
    }
  }
  if (duplicate) {
    titleInput.style.outline = '1.5px solid var(--red)';
    titleInput.placeholder = '이미 있는 이름이에요';
    setTimeout(() => {
      titleInput.style.outline = '';
      titleInput.placeholder = '제목을 입력하세요';
    }, 2000);
    return;
  }
  const repeatVal = (() => {
    const rv = document.getElementById('add-repeat').value;
    if (rv === 'DayOfMonth') {
      const sel = [...document.querySelectorAll('#add-repeat-detail-picker .repeat-chip.selected')].map(b => b.dataset.val);
      return sel.length ? 'DayOfMonth:' + sel.join(',') : null;
    }
    if (rv === 'DayOfWeek') {
      const sel = [...document.querySelectorAll('#add-repeat-detail-picker .repeat-chip.selected')].map(b => b.dataset.val);
      return sel.length ? 'DayOfWeek:' + sel.join(',') : null;
    }
    return rv || null;
  })();

  // 오늘 해당 여부로 초기 상태 결정
  const effective = getEffectiveNow();
  let initialStatus = 'Active';
  if (repeatVal && repeatVal.startsWith('DayOfWeek:')) {
    const days = repeatVal.slice(10).split(',').map(Number);
    if (!days.includes(effective.getDay())) initialStatus = 'Inactive';
  } else if (repeatVal && repeatVal.startsWith('DayOfMonth:')) {
    const dates = repeatVal.slice(11).split(',').map(Number);
    if (!dates.includes(effective.getDate())) initialStatus = 'Inactive';
  }

  TodoRepository.create({
    title,
    detail: detailInput.value.trim(),
    trackers: addTrackers.map(t => ({ ...t })),
    meta: {
      status: initialStatus,
      inactive: initialStatus === 'Inactive',
      repeat: repeatVal,
      startDate: document.getElementById('add-start-date').value || null,
      deadline: document.getElementById('add-deadline').value || null,
      memorable: addMemorableOn,
      color: selectedAddColor,
    }
  });
  closeSheet();
  renderAll();
}

function renderAddTrackerItem(tracker) {
  const list = document.getElementById('add-tracker-list');
  const el = document.createElement('div');
  el.className = 'tracker-item';
  el.dataset.tid = tracker.id;
  if (tracker.type === 'checkbox') {
    el.innerHTML = `<div class="tracker-checkbox${tracker.checked ? ' checked' : ''}"></div><input class="tracker-text-input${tracker.checked ? ' checked' : ''}" placeholder="항목 이름" value="${escHtml(tracker.text)}"><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    const cb = el.querySelector('.tracker-checkbox');
    const inp = el.querySelector('.tracker-text-input');
    cb.addEventListener('click', () => { tracker.checked = !tracker.checked; cb.classList.toggle('checked', tracker.checked); inp.classList.toggle('checked', tracker.checked); });
    inp.addEventListener('input', () => { tracker.text = inp.value; });
  } else {
    el.innerHTML = `<input class="tracker-counter-label" placeholder="설명" value="${escHtml(tracker.label)}"><div class="tracker-counter-controls"><input class="tracker-counter-val-input" type="number" min="0" value="${tracker.current}" style="width:38px"><span class="tracker-counter-sep">/</span><input class="tracker-counter-goal" type="number" min="0" value="${tracker.goal}"><button class="tracker-counter-btn" data-dir="1">+</button></div><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    el.querySelector('.tracker-counter-label').addEventListener('input', e => { tracker.label = e.target.value; });
    el.querySelector('.tracker-counter-val-input').addEventListener('input', e => { tracker.current = parseInt(e.target.value) || 0; });
    el.querySelector('.tracker-counter-goal').addEventListener('input', e => { tracker.goal = parseInt(e.target.value) || 0; });
    el.querySelector('.tracker-counter-btn').addEventListener('click', () => {
      tracker.current++;
      el.querySelector('.tracker-counter-val-input').value = tracker.current;
    });
  }
  el.querySelector('.tracker-delete-btn').addEventListener('click', () => { addTrackers = addTrackers.filter(t => t.id !== tracker.id); el.remove(); });
  list.appendChild(el);
}

function renderTrackers(card, item) {
  const existing = card.querySelector('.tracker-section-expanded');
  if (existing) existing.remove();
  if (!item.trackers || item.trackers.length === 0) {
    // 추적기 없어도 추가 UI는 보여줌
    appendTrackerAddRow(card, item);
    return;
  }
  const section = document.createElement('div');
  section.className = 'tracker-section-expanded';
  section.style.cssText = 'margin-bottom:10px;';
  const header = document.createElement('div');
  header.className = 'tracker-section-header';
  header.innerHTML = '<span class="tracker-section-label">추적기</span>';
  section.appendChild(header);
  item.trackers.forEach(tracker => {
    const el = buildTrackerEl(tracker, item, card, section);
    section.appendChild(el);
  });
  appendTrackerAddRow(card, item, section);
  const metaGrid = card.querySelector('.meta-grid');
  if (metaGrid) metaGrid.before(section);
  else card.querySelector('.card-expanded').appendChild(section);
}

function buildTrackerEl(tracker, item, card, section) {
  const el = document.createElement('div');
  el.className = 'tracker-item';
  el.dataset.tid = tracker.id;
  if (tracker.type === 'checkbox') {
    el.innerHTML = `<div class="tracker-checkbox${tracker.checked ? ' checked' : ''}"></div><input class="tracker-text-input${tracker.checked ? ' checked' : ''}" placeholder="항목 이름" value="${escHtml(tracker.text)}" style="flex:1"><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    const inp = el.querySelector('.tracker-text-input');
    inp.addEventListener('input', e => { tracker.text = e.target.value; saveTrackers(item); });
    el.querySelector('.tracker-checkbox').addEventListener('click', () => {
      tracker.checked = !tracker.checked;
      el.querySelector('.tracker-checkbox').classList.toggle('checked', tracker.checked);
      inp.classList.toggle('checked', tracker.checked);
      saveTrackers(item);
    });
  } else {
    el.innerHTML = `<input class="tracker-counter-label" placeholder="설명" value="${escHtml(tracker.label)}" style="flex:1;min-width:0"><div class="tracker-counter-controls"><input class="tracker-counter-val-input" type="number" min="0" value="${tracker.current}" style="width:38px"><span class="tracker-counter-sep">/</span><input class="tracker-counter-goal" type="number" min="0" value="${tracker.goal}" style="width:38px"><button class="tracker-counter-btn" data-dir="1">+</button></div><button class="tracker-delete-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    el.querySelector('.tracker-counter-label').addEventListener('input', e => { tracker.label = e.target.value; saveTrackers(item); });
    el.querySelector('.tracker-counter-val-input').addEventListener('input', e => { tracker.current = parseInt(e.target.value) || 0; saveTrackers(item); });
    el.querySelector('.tracker-counter-goal').addEventListener('change', e => { tracker.goal = parseInt(e.target.value) || 0; saveTrackers(item); });
    el.querySelector('.tracker-counter-btn').addEventListener('click', () => {
      tracker.current++;
      el.querySelector('.tracker-counter-val-input').value = tracker.current;
      saveTrackers(item);
    });
  }
  el.querySelector('.tracker-delete-btn').addEventListener('click', () => {
    item.trackers = item.trackers.filter(t => t.id !== tracker.id);
    saveTrackers(item);
    el.remove();
    if (item.trackers.length === 0) renderTrackers(card, item);
  });
  return el;
}

function appendTrackerAddRow(card, item, section) {
  if (!section) {
    // section 없으면 새로 만들어서 추가
    const s = document.createElement('div');
    s.className = 'tracker-section-expanded';
    s.style.cssText = 'margin-bottom:10px;';
    const h = document.createElement('div');
    h.className = 'tracker-section-header';
    h.innerHTML = '<span class="tracker-section-label">추적기</span>';
    s.appendChild(h);
    appendTrackerAddRow(card, item, s);
    const metaGrid = card.querySelector('.meta-grid');
    if (metaGrid) metaGrid.before(s);
    return;
  }
  const addRow = document.createElement('div');
  addRow.style.cssText = 'margin-top:4px;';

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TODO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Bricolage+Grotesque:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --surface3: #252529;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0efe8;
    --text-2: #9a9990;
    --text-3: #5a5955;
    --accent: #c8f064;
    --accent-dim: rgba(200,240,100,0.12);
    --accent-border: rgba(200,240,100,0.3);
    --red: #ff6b6b;
    --red-dim: rgba(255,107,107,0.12);
    --amber: #f4a535;
    --amber-dim: rgba(244,165,53,0.12);
    --blue: #6db3f2;
    --blue-dim: rgba(109,179,242,0.12);
    --teal: #5dcaa5;
    --teal-dim: rgba(93,202,165,0.12);
    --purple: #a89fec;
    --purple-dim: rgba(168,159,236,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 5px;
    --font-display: 'Instrument Serif', serif;
    --font-body: 'Bricolage Grotesque', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
  }

  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── HEADER ── */
  #header {
    padding: 20px 20px 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 0.5px solid var(--border);
  }

  #header-left h1 {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  #header-left .date-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  .stats-pills {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .stat-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    color: var(--text-2);
    background: var(--surface2);
    letter-spacing: 0.02em;
  }

  .stat-pill.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .stat-pill.overdue { border-color: rgba(255,107,107,0.3); color: var(--red); background: var(--red-dim); }

  /* ── SUB BAR ── */
  #sub-bar {
    padding: 8px 20px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    border-bottom: 0.5px solid var(--border);
  }

  .sub-bar-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.05em;
    transition: all var(--transition);
    display: flex; align-items: center; gap: 5px;
  }
  .sub-bar-btn:hover { border-color: var(--border2); color: var(--text-2); }
  .sub-bar-btn.active { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .sub-bar-btn.active svg { transform: rotate(180deg); }

  /* ── TODO LIST ── */
  #todo-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 120px;
    scrollbar-width: none;
  }
  #todo-scroll::-webkit-scrollbar { display: none; }

  #todo-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ── TODO CARD ── */
  .todo-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    transition: border-color var(--transition), transform var(--transition), background var(--transition);
    position: relative;
    overflow: hidden;
    cursor: grab;
    user-select: none;
  }
  .todo-card:hover { border-color: var(--border2); }
  .todo-card.dragging {
    opacity: 0.5;
    cursor: grabbing;
    transform: scale(0.98);
    border-color: var(--accent-border);
  }
  .todo-card.drag-over { border-color: var(--accent-border); background: var(--surface2); }
  .todo-card.pinned { cursor: default; }
  .todo-card.expanded { border-color: var(--border2); background: var(--surface2); }

  /* color accent bar */
  .todo-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-color, transparent);
    border-radius: 3px 0 0 3px;
  }

  .card-main {
    padding: 12px 14px 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-drag-handle {
    flex-shrink: 0;
    width: 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    opacity: 0.25;
    transition: opacity var(--transition);
    padding: 2px 0;
  }
  .todo-card:hover .card-drag-handle { opacity: 0.5; }
  .todo-card.pinned .card-drag-handle { opacity: 0.1; }
  .card-drag-handle span {
    display: block;
    height: 1.5px;
    background: var(--text);
    border-radius: 2px;
  }

  .card-checkbox {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border2);
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    transition: all var(--transition);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .card-checkbox:hover { border-color: var(--accent); }
  .card-checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .card-checkbox.checked::after {
    content: '';
    width: 6px; height: 4px;
    border-left: 1.5px solid #0e0e0f;
    border-bottom: 1.5px solid #0e0e0f;
    transform: rotate(-45deg) translateY(-1px);
  }

  .card-title-wrap { flex: 1; min-width: 0; }
  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color var(--transition);
  }
  .card-title.done { text-decoration: line-through; color: var(--text-3); }

  .card-meta-row {
    display: flex;
    gap: 6px;
    margin-top: 3px;
    flex-wrap: wrap;
  }

  .meta-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.03em;
  }
  .meta-tag.status-active { background: var(--accent-dim); color: var(--accent); }
  .meta-tag.status-completed { background: var(--surface3); color: var(--text-3); }
  .meta-tag.status-archived { background: var(--surface3); color: var(--text-3); }
  .meta-tag.status-overdue { background: var(--red-dim); color: var(--red); }
  .meta-tag.status-notyet { background: var(--blue-dim); color: var(--blue); }
  .meta-tag.repeat { background: var(--blue-dim); color: var(--blue); }
  .meta-tag.deadline { background: var(--amber-dim); color: var(--amber); }
  .meta-tag.template { background: var(--purple-dim); color: var(--purple); }

  .card-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .pin-btn {
    width: 24px; height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    transition: color var(--transition), transform var(--transition);
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    padding: 0;
    opacity: 0;
    transition: opacity var(--transition), color var(--transition);
  }
  .todo-card:hover .pin-btn { opacity: 1; }
  .pin-btn.pinned { color: var(--amber); opacity: 1; }
  .pin-btn svg { width: 13px; height: 13px; }

  .expand-btn {
    width: 24px; height: 24px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-3);
    display: flex; align-items: center; justify-content: center;
    transition: color var(--transition), transform var(--transition);
    border-radius: 4px;
  }
  .expand-btn:hover { color: var(--text-2); }
  .expand-btn svg {
    width: 12px; height: 12px;
    transition: transform var(--transition);
  }
  .todo-card.expanded .expand-btn svg { transform: rotate(180deg); }

  /* ── EXPANDED PANEL ── */
  .card-expanded {
    display: none;
    padding: 0 18px 14px 18px;
    border-top: 0.5px solid var(--border);
    margin-top: 0;
  }
  .card-expanded.open { display: block; }

  .detail-text {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    margin: 10px 0;
    white-space: pre-wrap;
    min-height: 16px;
  }
  .detail-text.empty { color: var(--text-3); font-style: italic; }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .meta-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .meta-field label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .meta-field input, .meta-field select {
    background: var(--surface3);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-xs);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    padding: 6px 8px;
    outline: none;
    transition: border-color var(--transition);
    width: 100%;
  }
  .meta-field input:focus, .meta-field select:focus {
    border-color: var(--accent-border);
  }
  .meta-field select option { background: var(--surface2); }

  .meta-field.full-width { grid-column: 1 / -1; }

  .color-picker-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .color-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color var(--transition), transform var(--transition);
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: var(--text); }

  .template-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .toggle-switch {
    width: 32px; height: 18px;
    background: var(--surface3);
    border: 0.5px solid var(--border2);
    border-radius: 9px;
    position: relative;
    transition: background var(--transition);
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--accent-dim); border-color: var(--accent-border); }
  .toggle-switch::after {
    content: '';
    width: 12px; height: 12px;
    background: var(--text-3);
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
    transition: transform var(--transition), background var(--transition);
  }
  .toggle-switch.on::after { transform: translateX(14px); background: var(--accent); }
  .template-toggle span { font-size: 12px; color: var(--text-2); }

  .expanded-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 0.5px solid var(--border);
  }
  .action-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: var(--radius-xs);
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all var(--transition);
  }
  .action-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .action-btn.danger:hover { border-color: rgba(255,107,107,0.4); color: var(--red); background: var(--red-dim); }
  .action-btn.archive:hover { border-color: rgba(244,165,53,0.4); color: var(--amber); background: var(--amber-dim); }
  .action-btn.archive.disabled { opacity: 0.3; cursor: not-allowed; }
  .action-btn.archive.disabled:hover { border-color: var(--border2); color: var(--text-2); background: transparent; }
  .action-btn.save { margin-left: auto; }

  /* PINNED SECTION LABEL */
  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  /* ── EMPTY STATE ── */
  #empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 60px 20px;
    color: var(--text-3);
    text-align: center;
  }
  #empty-state.show { display: flex; }
  #empty-state .empty-icon {
    font-size: 40px;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--surface3);
  }
  #empty-state p { font-size: 13px; color: var(--text-3); }

  /* ── QUICK ACTION ── */
  #fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(calc(-100% - 6px));
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 24px rgba(200,240,100,0.25);
    transition: transform var(--transition), box-shadow var(--transition);
    z-index: 100;
  }
  #fab:hover { transform: translateX(calc(-100% - 6px)) scale(1.06); box-shadow: 0 6px 32px rgba(200,240,100,0.35); }
  #fab:active { transform: translateX(calc(-100% - 6px)) scale(0.96); }
  #fab svg { width: 22px; height: 22px; color: #0e0e0f; }

  /* ── CLOSE (마감) BUTTON ── */
  #close-btn {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(6px);
    width: 52px; height: 52px;
    background: var(--surface2);
    border-radius: 50%;
    border: 0.5px solid var(--border2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform var(--transition), background var(--transition), border-color var(--transition);
    z-index: 100;
    color: var(--text-2);
  }
  #close-btn:hover { transform: translateX(6px) scale(1.06); background: var(--surface3); border-color: var(--accent-border); color: var(--accent); }
  #close-btn:active { transform: translateX(6px) scale(0.96); }
  #close-btn svg { width: 20px; height: 20px; }

  /* ── ARCHIVE OVERLAY ── */
  #archive-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 150;
    display: none;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #archive-overlay.open { display: flex; transform: translateX(0); }

  #archive-header {
    padding: 20px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  #archive-header-left {
    display: flex; align-items: center; gap: 12px;
  }
  #archive-back-btn {
    width: 32px; height: 32px;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  #archive-back-btn:hover { background: var(--surface3); color: var(--text); }
  #archive-header h2 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
  }
  #archive-count-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    color: var(--text-3);
    background: var(--surface2);
  }
  #archive-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 40px;
    scrollbar-width: none;
  }
  #archive-scroll::-webkit-scrollbar { display: none; }
  #archive-list { display: flex; flex-direction: column; gap: 6px; }
  #archive-empty {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    gap: 8px;
    color: var(--text-3);
    text-align: center;
  }
  #archive-empty.show { display: flex; }

  /* Archive card — read-only, muted */
  .archive-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px 10px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .archive-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-color, transparent);
    border-radius: 3px 0 0 3px;
  }
  .archive-card-title {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .archive-card-date {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    flex-shrink: 0;
  }
  .archive-restore-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    flex-shrink: 0;
    transition: all var(--transition);
  }
  .archive-restore-btn:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }
  .archive-delete-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    flex-shrink: 0;
    transition: all var(--transition);
  }
  .archive-delete-btn:hover { border-color: rgba(255,107,107,0.4); color: var(--red); background: var(--red-dim); }

  /* ── CONFIRM MODAL ── */
  #confirm-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #confirm-modal.open { display: flex; }
  #confirm-box {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: 16px;
    padding: 24px 20px 20px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  #confirm-box h3 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
    margin-bottom: 8px;
  }
  #confirm-box p {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  #confirm-box p span { color: var(--accent); font-weight: 500; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button { flex: 1; padding: 10px; border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 14px; cursor: pointer; transition: all var(--transition); }
  #confirm-cancel { background: var(--surface3); border: 0.5px solid var(--border2); color: var(--text-2); }
  #confirm-cancel:hover { background: var(--surface2); }
  #confirm-ok { background: var(--accent); border: none; color: #0e0e0f; font-weight: 600; }
  #confirm-ok:hover { background: #d4f56a; }

  /* ── MODAL OVERLAY ── */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }

  /* ── ADD TODO SHEET ── */
  #add-sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    border-top: 0.5px solid var(--border2);
    border-left: 0.5px solid var(--border);
    border-right: 0.5px solid var(--border);
    width: 100%;
    max-width: 480px;
    padding: 0 0 env(safe-area-inset-bottom, 16px);
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 90vh;
    overflow-y: auto;
  }
  #modal-overlay.open #add-sheet {
    transform: translateY(0);
  }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 12px auto 4px;
  }

  .sheet-header {
    padding: 8px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
  }
  .sheet-header h2 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
  }

  .sheet-close {
    width: 28px; height: 28px;
    background: var(--surface3);
    border: 0.5px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .sheet-close:hover { background: var(--surface2); color: var(--text); }
  .sheet-close svg { width: 12px; height: 12px; }

  .sheet-body { padding: 16px 20px; }

  .sheet-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-body);
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    padding: 0;
    caret-color: var(--accent);
    resize: none;
  }
  .sheet-input::placeholder { color: var(--text-3); }

  .sheet-detail-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-2);
    padding: 0;
    caret-color: var(--accent);
    resize: none;
    min-height: 40px;
    margin-top: 8px;
    line-height: 1.6;
  }
  .sheet-detail-input::placeholder { color: var(--text-3); }

  .sheet-divider {
    height: 0.5px;
    background: var(--border);
    margin: 12px 0;
  }

  /* meta expand toggle */
  .meta-expand-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    cursor: pointer;
    color: var(--text-3);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    transition: all var(--transition);
    width: 100%;
    justify-content: center;
  }
  .meta-expand-btn:hover { border-color: var(--border2); color: var(--text-2); }
  .meta-expand-btn svg { width: 12px; height: 12px; transition: transform var(--transition); }
  .meta-expand-btn.expanded svg { transform: rotate(180deg); }

  #add-meta-block {
    display: none;
    padding-top: 12px;
  }
  #add-meta-block.open { display: block; }

  .sheet-footer {
    padding: 12px 20px 16px;
    border-top: 0.5px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .submit-btn {
    background: var(--accent);
    color: #0e0e0f;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 24px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.01em;
  }
  .submit-btn:hover { background: #d4f56a; }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.4; cursor: default; }

  .char-hint {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
  }

  /* ── DRAG PLACEHOLDER ── */
  .drag-placeholder {
    height: 56px;
    border: 1.5px dashed var(--accent-border);
    border-radius: var(--radius);
    background: var(--accent-dim);
    pointer-events: none;
  }

  /* Scrollbar */
  #todo-scroll::-webkit-scrollbar { width: 3px; }
  #todo-scroll::-webkit-scrollbar-track { background: transparent; }
  #todo-scroll::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

  /* Animations */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .todo-card { animation: cardIn 0.2s ease forwards; }

  @keyframes sheetIn {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="app">

<!-- ARCHIVE VIEW OVERLAY -->

        </button>

<button id="fab" title="새 할 일 추가">

</button>

<!-- CONFIRM MODAL -->
<div id="confirm-modal">

    <p id="confirm-desc">완료된 TODO <span id="confirm-count">0</span>개를<br>보관함으로 이동할까요?</p>
    <div class="confirm-actions">

</div>
<div id="modal-overlay">
  <div id="add-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>New todo</h2>
      <button class="sheet-close" id="sheet-close-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">

        </svg>

    </div>
    <div class="sheet-body">
      <textarea class="sheet-input" id="todo-title-input" placeholder="제목을 입력하세요" rows="1" maxlength="100"></textarea>
      <textarea class="sheet-detail-input" id="todo-detail-input" placeholder="상세 내용 (선택)" rows="3"></textarea>
      <div class="sheet-divider"></div>
      <button class="meta-expand-btn" id="meta-expand-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M19 9l-7 7-7-7"/>
        </svg>
        메타데이터 추가
      </button>
      <div id="add-meta-block">
        <div class="meta-grid" style="margin-top:12px">
          <div class="meta-field">
            <label>상태</label>
            <select id="add-status" disabled style="opacity:0.4;cursor:not-allowed">
              <option value="Active">Active</option>
            </select>
          </div>
          <div class="meta-field">
            <label>반복</label>
            <select id="add-repeat">
              <option value="">없음</option>
              <option value="Daily">Daily</option>
              <option value="Weekly">Weekly</option>
              <option value="Monthly">Monthly</option>
            </select>
          </div>
          <div class="meta-field">
            <label>시작일</label>
            <input type="date" id="add-start-date">
          </div>
          <div class="meta-field">
            <label>데드라인</label>
            <input type="date" id="add-deadline">
          </div>
          <div class="meta-field full-width">
            <label>색상</label>
            <div class="color-picker-row" id="add-color-picker">
              <div class="color-dot" data-color="" style="background:var(--surface3); border-color: var(--text)" title="없음"></div>
              <div class="color-dot" data-color="var(--accent)" style="background:var(--accent)" title="Green"></div>
              <div class="color-dot" data-color="var(--blue)" style="background:var(--blue)" title="Blue"></div>
              <div class="color-dot" data-color="var(--amber)" style="background:var(--amber)" title="Amber"></div>
              <div class="color-dot" data-color="var(--red)" style="background:var(--red)" title="Red"></div>
              <div class="color-dot" data-color="var(--purple)" style="background:var(--purple)" title="Purple"></div>
              <div class="color-dot" data-color="var(--teal)" style="background:var(--teal)" title="Teal"></div>
            </div>
          </div>
          <div class="meta-field full-width">
            <label>옵션</label>
            <label class="template-toggle" id="add-memorable-toggle">
              <div class="toggle-switch" id="add-memorable-switch"></div>
              <span>Memorable</span>
            </label>
          </div>

    <div class="sheet-footer">
      <span class="char-hint" id="title-char-hint">0/100</span>
      <button class="submit-btn" id="add-submit-btn" disabled>추가</button>
    </div>
  </div>
</div>

<script>
// ── DATA LAYER (Repository Pattern) ──────────────────────────────
const TodoRepository = (() => {
  const STORAGE_KEY = 'todo_items_v1';
  const ORDER_KEY = 'todo_order_v1';

  // These can be swapped for any backend adapter
  const adapter = {
    read: () => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    },
    write: (items) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    },
    readOrder: () => {
      try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; }
      catch { return []; }
    },
    writeOrder: (order) => {
      localStorage.setItem(ORDER_KEY, JSON.stringify(order));
    }
  };

  const getAll = () => adapter.read();
  const getOrder = () => adapter.readOrder();

  const save = (items) => adapter.write(items);
  const saveOrder = (order) => adapter.writeOrder(order);

  const create = (data) => {
    const items = getAll();
    const newItem = {
      id: `todo_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      title: data.title || '',
      detail: data.detail || '',
      pinned: false,
      meta: {
        status: data.meta?.status || 'Active',
        repeat: data.meta?.repeat || null,
        deadline: data.meta?.deadline || null,
        startDate: data.meta?.startDate || null,
        memorable: data.meta?.memorable || false,
        color: data.meta?.color || '',
      },
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    items.push(newItem);
    save(items);

    const order = getOrder();
    order.push(newItem.id);
    saveOrder(order);

    return newItem;
  };

  const update = (id, patch) => {
    const items = getAll();
    const idx = items.findIndex(i => i.id === id);
    if (idx === -1) return null;
    items[idx] = { ...items[idx], ...patch, updatedAt: new Date().toISOString() };
    if (patch.meta) items[idx].meta = { ...items[idx].meta, ...patch.meta };
    save(items);
    return items[idx];
  };

  const remove = (id) => {
    let items = getAll();
    items = items.filter(i => i.id !== id);
    save(items);
    const order = getOrder().filter(oid => oid !== id);
    saveOrder(order);
  };

  const reorder = (newOrder) => saveOrder(newOrder);

  const getSorted = () => {
    const items = getAll();
    const order = getOrder();
    const map = Object.fromEntries(items.map(i => [i.id, i]));
    // Pinned first, then follow saved order
    const ordered = order.map(id => map[id]).filter(Boolean);
    // append any items not in order yet
    items.forEach(item => { if (!order.includes(item.id)) ordered.push(item); });
    return ordered;
  };

  return { getAll, getSorted, getOrder, create, update, remove, reorder };
})();

// ── BUSINESS LOGIC ────────────────────────────────────────────────
const TodoService = {
  checkOverdue: (item) => {
    if (!item.meta.deadline) return false;
    if (['Completed', 'Archived'].includes(item.meta.status)) return false;
    return new Date(item.meta.deadline) < new Date();
  },

  checkNotYet: (item) => {
    if (!item.meta.startDate) return false;
    if (['Completed', 'Archived'].includes(item.meta.status)) return false;
    const start = new Date(item.meta.startDate);
    start.setHours(0, 0, 0, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return start > today;
  },

  resolveStatus: (item) => {
    if (!item?.meta?.status) return 'Active';
    if (TodoService.checkNotYet(item)) return 'NotYet';
    if (TodoService.checkOverdue(item)) return 'Overdue';
    return item.meta.status;
  },

  formatDate: (dateStr) => {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
  },

  toggle: (id) => {
    const items = TodoRepository.getAll();
    const item = items.find(i => i.id === id);
    if (!item) return;
    const newStatus = item.meta.status === 'Completed' ? 'Active' : 'Completed';
    // memorable은 절대 변경하지 않고 status만 업데이트
    return TodoRepository.update(id, { meta: { status: newStatus, memorable: item.meta.memorable } });
  }
};

// ── UI STATE ──────────────────────────────────────────────────────
let currentFilter = 'all';
let dragState = { dragging: null, placeholder: null };
let expandedId = null;
let selectedAddColor = '';
let addMemorableOn = false;
let showCompleted = false;

// ── RENDER ────────────────────────────────────────────────────────
function getColorVar(colorVal) {
  // Map CSS variable strings to hex for style
  const map = {
    'var(--accent)': '#c8f064',
    'var(--blue)': '#6db3f2',
    'var(--amber)': '#f4a535',
    'var(--red)': '#ff6b6b',
    'var(--purple)': '#a89fec',
    'var(--teal)': '#5dcaa5',
  };
  return map[colorVal] || colorVal || '';
}

function filterItems(items) {
  // 'all': Archived 항상 숨김, Completed·NotYet은 showCompleted 플래그에 따라 숨김
  return items.filter(i => {
    const s = TodoService.resolveStatus(i);
    if (s === 'Archived') return false;
    if ((s === 'Completed' || s === 'NotYet') && !showCompleted) return false;
    return true;
  });
}

function renderAll() {
  const allItems = TodoRepository.getSorted();
  const filtered = filterItems(allItems);

  const pinned = filtered.filter(i => i.pinned);
  const unpinned = filtered.filter(i => !i.pinned);

  const list = document.getElementById('todo-list');
  const empty = document.getElementById('empty-state');

  list.innerHTML = '';

  if (filtered.length === 0) {
    empty.classList.add('show');
  } else {
    empty.classList.remove('show');
  }

  if (pinned.length > 0) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'Pinned';
    list.appendChild(label);
    pinned.forEach(item => list.appendChild(createCard(item)));
    if (unpinned.length > 0) {
      const label2 = document.createElement('div');
      label2.className = 'section-label';
      label2.textContent = 'Others';
      list.appendChild(label2);
    }
  }
  unpinned.forEach(item => list.appendChild(createCard(item)));

  updateStats(allItems);
  setupDragDrop();

  // 카드 확장 중이면 하단 버튼 숨김
  const hasExpanded = expandedId !== null;
  document.getElementById('fab').style.display = hasExpanded ? 'none' : '';
  document.getElementById('close-btn').style.display = hasExpanded ? 'none' : '';
}

function createCard(item) {
  const status = TodoService.resolveStatus(item);
  const isDone = item.meta.status === 'Completed';
  const colorHex = getColorVar(item.meta.color);

  const card = document.createElement('div');
  card.className = `todo-card${item.pinned ? ' pinned' : ''}${expandedId === item.id ? ' expanded' : ''}`;
  card.dataset.id = item.id;
  if (colorHex) card.style.setProperty('--card-color', colorHex);

  // Build meta tags
  const statusLabel = { Active: 'Active', Completed: 'Completed', Overdue: 'Overdue', NotYet: 'Not yet', Archived: 'Archived' };
  let metaTagsHTML = '';
  metaTagsHTML += `<span class="meta-tag status-${status.toLowerCase()}">${statusLabel[status] || status}</span>`;
  if (item.meta.repeat) metaTagsHTML += `<span class="meta-tag repeat">${item.meta.repeat}</span>`;
  if (item.meta.memorable) metaTagsHTML += `<span class="meta-tag template">Memorable</span>`;
  if (item.meta.deadline) {
    const df = TodoService.formatDate(item.meta.deadline);
    metaTagsHTML += `<span class="meta-tag deadline">${df}</span>`;
  }

  card.innerHTML = `
    <div class="card-main">
      <div class="card-drag-handle" data-drag>
        <span></span><span></span><span></span>
      </div>
      <div class="card-checkbox${isDone ? ' checked' : ''}" data-toggle></div>
      <div class="card-title-wrap">
        <div class="card-title${isDone ? ' done' : ''}">${escHtml(item.title)}</div>
        <div class="card-meta-row">${metaTagsHTML}</div>
      </div>
      <div class="card-right">
        <button class="pin-btn${item.pinned ? ' pinned' : ''}" data-pin title="${item.pinned ? '고정 해제' : '고정'}">
          <svg viewBox="0 0 24 24" fill="${item.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </button>
        <button class="expand-btn" data-expand>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="card-expanded${expandedId === item.id ? ' open' : ''}">
      ${renderExpandedPanel(item)}
    </div>
  `;

  // Wire events
  // 체크박스 클릭 (싱글) — 더블클릭과 구분하기 위해 딜레이 적용
  let clickTimer = null;
  card.querySelector('[data-toggle]').addEventListener('click', (e) => {
    e.stopPropagation();
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      TodoService.toggle(item.id);
      renderAll();
    }, 220);
  });

  // 더블클릭으로 Active ↔ Completed 토글
  card.querySelector('.card-main').addEventListener('dblclick', (e) => {
    if (e.target.closest('[data-pin],[data-toggle],[data-expand]')) return;
    e.stopPropagation();
    clearTimeout(clickTimer); // 싱글클릭 타이머 취소
    TodoService.toggle(item.id);
    renderAll();
  });

  card.querySelector('[data-pin]').addEventListener('click', (e) => {
    e.stopPropagation();
    TodoRepository.update(item.id, { pinned: !item.pinned });
    renderAll();
  });

  card.querySelector('[data-expand]').addEventListener('click', (e) => {
    e.stopPropagation();
    expandedId = expandedId === item.id ? null : item.id;
    renderAll();
  });

  // Wire expanded panel events
  if (expandedId === item.id) {
    wireExpandedPanel(card, item);
  }

  // Long press to pin
  let pressTimer = null;
  card.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-pin],[data-toggle],[data-expand],.card-expanded')) return;
    pressTimer = setTimeout(() => {
      if (!item.pinned) {
        TodoRepository.update(item.id, { pinned: true });
        renderAll();
      }
    }, 600);
  });
  card.addEventListener('pointerup', () => clearTimeout(pressTimer));
  card.addEventListener('pointermove', () => clearTimeout(pressTimer));

  return card;
}

function renderExpandedPanel(item) {
  const colorHex = getColorVar(item.meta.color);
  const colorDots = [
    { val: '', bg: 'var(--surface3)', label: '없음' },
    { val: 'var(--accent)', bg: 'var(--accent)', label: 'Green' },
    { val: 'var(--blue)', bg: 'var(--blue)', label: 'Blue' },
    { val: 'var(--amber)', bg: 'var(--amber)', label: 'Amber' },
    { val: 'var(--red)', bg: 'var(--red)', label: 'Red' },
    { val: 'var(--purple)', bg: 'var(--purple)', label: 'Purple' },
    { val: 'var(--teal)', bg: 'var(--teal)', label: 'Teal' },
  ];

  const statusLabel = { Active: 'Active', Completed: 'Completed', Overdue: 'Overdue', NotYet: 'Not yet', Archived: 'Archived' };
  const resolvedStatus = TodoService.resolveStatus(item);

  return `
    <p class="detail-text${item.detail ? '' : ' empty'}" id="detail-${item.id}">${item.detail ? escHtml(item.detail) : '상세 내용 없음'}</p>
    <div class="meta-grid">
      <div class="meta-field">
        <label>상태</label>
        <div style="display:flex;align-items:center;height:30px">
          <span class="meta-tag status-${resolvedStatus.toLowerCase()}" style="font-size:11px;padding:3px 8px">${statusLabel[resolvedStatus] || resolvedStatus}</span>
        </div>
      </div>
      <div class="meta-field">
        <label>반복</label>
        <div style="display:flex;align-items:center;height:30px">
          ${item.meta.repeat
            ? `<span class="meta-tag repeat" style="font-size:11px;padding:3px 8px">${item.meta.repeat}</span>`
            : `<span style="font-size:12px;color:var(--text-3)">없음</span>`
          }
        </div>
      </div>
      <div class="meta-field">
        <label>시작일</label>
        <input type="date" data-field="startDate" value="${item.meta.startDate || ''}">
      </div>
      <div class="meta-field">
        <label>데드라인</label>
        <input type="date" data-field="deadline" value="${item.meta.deadline || ''}">
      </div>
      <div class="meta-field full-width">
        <label>색상</label>
        <div class="color-picker-row" data-color-picker>
          ${colorDots.map(c => `
            <div class="color-dot${item.meta.color === c.val ? ' selected' : ''}" 
                 data-color-val="${c.val}" 
                 style="background:${c.bg}" 
                 title="${c.label}"></div>
          `).join('')}
        </div>
      </div>
      <div class="meta-field full-width">
        <label>제목 편집</label>
        <input type="text" data-field="title" value="${escHtml(item.title)}" style="font-size:14px;font-weight:500">
      </div>
      <div class="meta-field full-width">
        <label>상세 내용</label>
        <textarea data-field="detail" rows="3" style="background:var(--surface3);border:0.5px solid var(--border2);border-radius:var(--radius-xs);color:var(--text);font-family:var(--font-body);font-size:12px;padding:6px 8px;outline:none;width:100%;resize:vertical">${escHtml(item.detail)}</textarea>
      </div>
      <div class="meta-field full-width">
        <label>옵션</label>
        <label class="template-toggle" style="cursor:pointer">
          <div class="toggle-switch${item.meta.memorable ? ' on' : ''}" data-template-switch></div>
          <span>Memorable</span>
        </label>
      </div>
    </div>
    <div class="expanded-actions">
      <button class="action-btn danger" data-delete>삭제</button>
      <button class="action-btn archive${item.meta.memorable ? '' : ' disabled'}" data-archive ${item.meta.memorable ? '' : 'disabled'}>보관</button>
      <button class="action-btn save" data-save>저장</button>
    </div>
  `;
}

function wireExpandedPanel(card, item) {
  // Memorable switch
  const tSwitch = card.querySelector('[data-template-switch]');
  if (tSwitch) {
    let memorableVal = item.meta.memorable;
    tSwitch.addEventListener('click', () => {
      memorableVal = !memorableVal;
      tSwitch.classList.toggle('on', memorableVal);
      // 보관 버튼 활성/비활성 동적 반영
      const archiveBtn = card.querySelector('[data-archive]');
      if (archiveBtn) {
        archiveBtn.disabled = !memorableVal;
        archiveBtn.classList.toggle('disabled', !memorableVal);
      }
    });
    tSwitch._getVal = () => memorableVal;
  }

  // Color picker
  const colorDots = card.querySelectorAll('[data-color-picker] .color-dot');
  let selectedColor = item.meta.color;
  colorDots.forEach(dot => {
    dot.addEventListener('click', () => {
      colorDots.forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      selectedColor = dot.dataset.colorVal;
    });
  });

  // Save
  card.querySelector('[data-save]')?.addEventListener('click', () => {
    const titleVal = card.querySelector('[data-field="title"]')?.value.trim();
    const detailVal = card.querySelector('[data-field="detail"]')?.value.trim();
    const startDate = card.querySelector('[data-field="startDate"]')?.value || null;
    const deadline = card.querySelector('[data-field="deadline"]')?.value || null;
    const memorable = tSwitch?._getVal() ?? item.meta.memorable;

    if (titleVal) {
      TodoRepository.update(item.id, {
        title: titleVal,
        detail: detailVal,
        meta: {
          status: item.meta.status,   // 직접 수정 불가 — 기존 값 유지
          repeat: item.meta.repeat,   // 직접 수정 불가 — 기존 값 유지
          startDate, deadline, memorable, color: selectedColor
        }
      });
      expandedId = null;
      renderAll();
    }
  });

  // Delete
  card.querySelector('[data-delete]')?.addEventListener('click', () => {
    TodoRepository.remove(item.id);
    expandedId = null;
    renderAll();
  });

  // Archive
  card.querySelector('[data-archive]')?.addEventListener('click', () => {
    TodoRepository.update(item.id, { meta: { status: 'Archived' } });
    expandedId = null;
    renderAll();
    renderArchive();
  });
}

function updateStats(items) {
  const active = items.filter(i => i.meta.status === 'Active' && !TodoService.checkOverdue(i)).length;
  const overdue = items.filter(i => TodoService.checkOverdue(i)).length;

  document.getElementById('stat-active').textContent = `${active} active`;
  const overdueEl = document.getElementById('stat-overdue');
  if (overdue > 0) {
    overdueEl.style.display = '';
    overdueEl.textContent = `${overdue} overdue`;
  } else {
    overdueEl.style.display = 'none';
  }
}

// ── DRAG & DROP ───────────────────────────────────────────────────
function setupDragDrop() {
  const list = document.getElementById('todo-list');
  const cards = [...list.querySelectorAll('.todo-card:not(.pinned)')];

  cards.forEach(card => {
    if (card.classList.contains('pinned')) return;

    card.setAttribute('draggable', true);

    card.addEventListener('dragstart', (e) => {
      dragState.dragging = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Placeholder
      dragState.placeholder = document.createElement('div');
      dragState.placeholder.className = 'drag-placeholder';
      setTimeout(() => card.style.opacity = '0.4', 0);
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      card.style.opacity = '';
      dragState.placeholder?.remove();
      dragState = { dragging: null, placeholder: null };
      saveOrder();
    });

    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!dragState.dragging || dragState.dragging === card) return;
      e.dataTransfer.dropEffect = 'move';
      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) {
        list.insertBefore(dragState.placeholder, card);
      } else {
        list.insertBefore(dragState.placeholder, card.nextSibling);
      }
    });

    card.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!dragState.dragging || dragState.dragging === card) return;
      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) {
        list.insertBefore(dragState.dragging, card);
      } else {
        list.insertBefore(dragState.dragging, card.nextSibling);
      }
    });
  });

  list.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!dragState.placeholder || list.contains(dragState.placeholder)) return;
    list.appendChild(dragState.placeholder);
  });
}

function saveOrder() {
  const list = document.getElementById('todo-list');
  const cards = [...list.querySelectorAll('.todo-card')];
  const newOrder = cards.map(c => c.dataset.id).filter(Boolean);

  // Merge with pinned order
  const allItems = TodoRepository.getSorted();
  const pinnedIds = allItems.filter(i => i.pinned).map(i => i.id);
  const combined = [...pinnedIds, ...newOrder.filter(id => !pinnedIds.includes(id))];
  TodoRepository.reorder(combined);
}

// ── SUB BAR ───────────────────────────────────────────────────────
document.getElementById('show-completed-top-btn').addEventListener('click', () => {
  showCompleted = !showCompleted;
  const btn = document.getElementById('show-completed-top-btn');
  btn.classList.toggle('active', showCompleted);
  document.getElementById('show-completed-label').textContent = showCompleted ? '숨기기' : '전부 보기';
  renderAll();
});

document.getElementById('archive-view-btn').addEventListener('click', () => {
  renderArchive();
  const el = document.getElementById('archive-overlay');
  el.style.display = 'flex';
  requestAnimationFrame(() => el.classList.add('open'));
});

document.getElementById('archive-back-btn').addEventListener('click', () => {
  const el = document.getElementById('archive-overlay');
  el.classList.remove('open');
  setTimeout(() => { el.style.display = 'none'; }, 300);
});

// ── ARCHIVE RENDER ────────────────────────────────────────────────
function renderArchive() {
  const items = TodoRepository.getAll().filter(i => i.meta.status === 'Archived');
  const list = document.getElementById('archive-list');
  const empty = document.getElementById('archive-empty');
  const pill = document.getElementById('archive-count-pill');

  list.innerHTML = '';
  pill.textContent = `${items.length}개`;

  if (items.length === 0) {
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  items.slice().reverse().forEach(item => {
    const colorHex = getColorVar(item.meta.color);
    const card = document.createElement('div');
    card.className = 'archive-card';
    if (colorHex) card.style.setProperty('--card-color', colorHex);

    const updatedDate = new Date(item.updatedAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });

    card.innerHTML = `
      <div class="archive-card-title">${escHtml(item.title)}</div>
      <div class="archive-card-date">${updatedDate}</div>
      <button class="archive-restore-btn" title="복원">복원</button>
      <button class="archive-delete-btn" title="삭제">삭제</button>
    `;
    card.querySelector('.archive-restore-btn').addEventListener('click', () => {
      TodoRepository.update(item.id, { meta: { status: 'Active' } });
      renderArchive();
      renderAll();
    });
    card.querySelector('.archive-delete-btn').addEventListener('click', () => {
      TodoRepository.remove(item.id);
      renderArchive();
      renderAll();
    });
    list.appendChild(card);
  });
}

// ── 마감 (CLOSE) BUTTON ───────────────────────────────────────────
document.getElementById('close-btn').addEventListener('click', () => {
  const completedItems = TodoRepository.getAll().filter(i => i.meta.status === 'Completed');
  if (completedItems.length === 0) {
    showToast('완료된 TODO가 없어요');
    return;
  }
  const memorableItems = completedItems.filter(i => i.meta.memorable);
  const archiveCount = memorableItems.length;

  const modal = document.getElementById('confirm-modal');
  const countEl = document.getElementById('confirm-count');
  const descEl = document.getElementById('confirm-desc');
  if (countEl) countEl.textContent = archiveCount;
  if (descEl) {
    if (archiveCount > 0) {
      descEl.innerHTML = `Memorable ${archiveCount}개는 보관함으로,<br>나머지 ${completedItems.length - archiveCount}개는 삭제됩니다.`;
    } else {
      descEl.innerHTML = `완료된 TODO ${completedItems.length}개가<br>모두 삭제됩니다. (Memorable 없음)`;
    }
  }
  modal.classList.add('open');

  document.getElementById('confirm-cancel').onclick = () => modal.classList.remove('open');
  document.getElementById('confirm-ok').onclick = () => {
    completedItems.forEach(item => {
      if (item.meta.memorable) {
        TodoRepository.update(item.id, { meta: { status: 'Archived' } });
      } else {
        TodoRepository.remove(item.id);
      }
    });
    modal.classList.remove('open');
    showCompleted = false;
    document.getElementById('show-completed-top-btn').classList.remove('active');
    document.getElementById('show-completed-label').textContent = '전부 보기';
    renderAll();
    showToast(archiveCount > 0 ? `${archiveCount}개 보관, ${completedItems.length - archiveCount}개 삭제됐어요` : `${completedItems.length}개가 삭제됐어요`);
  };
});

// ── TOAST ─────────────────────────────────────────────────────────
function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 0.5px solid var(--border2);
      color: var(--text-2); font-family: var(--font-mono); font-size: 12px;
      padding: 8px 16px; border-radius: 20px; z-index: 400;
      opacity: 0; transition: opacity 0.2s ease; white-space: nowrap;
      letter-spacing: 0.03em;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2200);
}

// ── ADD SHEET ─────────────────────────────────────────────────────
const fab = document.getElementById('fab');
const overlay = document.getElementById('modal-overlay');
const closeBtn = document.getElementById('sheet-close-btn');
const titleInput = document.getElementById('todo-title-input');
const detailInput = document.getElementById('todo-detail-input');
const submitBtn = document.getElementById('add-submit-btn');
const metaToggle = document.getElementById('meta-expand-toggle');
const metaBlock = document.getElementById('add-meta-block');
const charHint = document.getElementById('title-char-hint');
const memorableSwitch = document.getElementById('add-memorable-switch');
const memorableToggle = document.getElementById('add-memorable-toggle');

fab.addEventListener('click', openSheet);
closeBtn.addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });

function openSheet() {
  overlay.classList.add('open');
  titleInput.value = '';
  detailInput.value = '';
  document.getElementById('add-status').value = 'Active';
  document.getElementById('add-repeat').value = '';
  document.getElementById('add-start-date').value = '';
  document.getElementById('add-deadline').value = '';
  submitBtn.disabled = true;
  charHint.textContent = '0/100';
  metaBlock.classList.remove('open');
  metaToggle.classList.remove('expanded');
  selectedAddColor = '';
  addMemorableOn = false;
  memorableSwitch.classList.remove('on');
  document.querySelectorAll('#add-color-picker .color-dot').forEach((d, i) => {
    d.classList.toggle('selected', i === 0);
  });
  setTimeout(() => titleInput.focus(), 350);
}

function closeSheet() {
  overlay.classList.remove('open');
}

titleInput.addEventListener('input', () => {
  autoResize(titleInput);
  const len = titleInput.value.trim().length;
  charHint.textContent = `${len}/100`;
  submitBtn.disabled = len === 0;
});

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

metaToggle.addEventListener('click', () => {
  const open = metaBlock.classList.toggle('open');
  metaToggle.classList.toggle('expanded', open);
});

memorableToggle.addEventListener('click', () => {
  addMemorableOn = !addMemorableOn;
  memorableSwitch.classList.toggle('on', addMemorableOn);
});

// Color picker in add sheet
document.querySelectorAll('#add-color-picker .color-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.querySelectorAll('#add-color-picker .color-dot').forEach(d => d.classList.remove('selected'));
    dot.classList.add('selected');
    selectedAddColor = dot.dataset.color;
  });
});

submitBtn.addEventListener('click', addTodo);
titleInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!submitBtn.disabled) addTodo(); }
});

function addTodo() {
  const title = titleInput.value.trim();
  if (!title) return;
  TodoRepository.create({
    title,
    detail: detailInput.value.trim(),
    meta: {
      status: 'Active',
      repeat: document.getElementById('add-repeat').value || null,
      startDate: document.getElementById('add-start-date').value || null,
      deadline: document.getElementById('add-deadline').value || null,
      memorable: addMemorableOn,
      color: selectedAddColor,
    }
  });
  closeSheet();
  renderAll();
}

// ── MISC ──────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateDateLabel() {
  const now = new Date();
  const label = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  document.getElementById('date-label').textContent = label;
}

// ── SEED DATA (only if first time) ───────────────────────────────
function seedIfEmpty() {
  if (TodoRepository.getAll().length > 0) return;
  const seeds = [
    { title: '프로젝트 설계 문서 작성', detail: '아키텍처 다이어그램 포함, 팀장 리뷰 전까지 완성', meta: { status: 'Active', color: 'var(--blue)', deadline: new Date(Date.now() + 2*86400000).toISOString().slice(0,10) } },
    { title: '주간 회의 준비', detail: '', meta: { status: 'Active', repeat: 'Weekly', color: 'var(--accent)' } },
    { title: '운동 루틴 확인', detail: '스트레칭 10분 + 유산소 30분', meta: { status: 'Active', repeat: 'Daily', color: 'var(--teal)' } },
    { title: '독서 — Atomic Habits', detail: '오늘 목표: 3챕터', meta: { status: 'Active', color: '' } },
    { title: '청구서 납부', detail: '공과금, 카드값', meta: { status: 'Overdue', color: 'var(--red)', deadline: new Date(Date.now() - 86400000).toISOString().slice(0,10) } },
    { title: '코드 리팩토링 (완료)', detail: '', meta: { status: 'Completed', color: '' } },
  ];
  seeds.forEach(s => TodoRepository.create(s));
  // Pin first item
  const all = TodoRepository.getAll();
  if (all[0]) TodoRepository.update(all[0].id, { pinned: true });
}

// ── INIT ──────────────────────────────────────────────────────────
updateDateLabel();
seedIfEmpty();
renderAll();
</script>
